<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/auth.css">
<title>Memo board · MySafar</title>
<style>
/* The memorisation progress board (memo_board.py). One table of every student's memo record, for staff on a laptop,
   for a whiteboard or projector (Whiteboard mode: bigger type, no controls) and for phones (each student a card).
   Each row is tinted by how recently the student passed: sage on track, gold slowing down, rose needs support,
   grey not started. The status is also written under the name, so it never rests on colour alone. */
:root{
 --on:#eaf4ec;--on-2:#d6ead9;--on-ink:#2c5a37;--on-dot:#5fa06e;
 --slow:#fbf3dd;--slow-2:#f4e3b3;--slow-ink:#6e4f06;--slow-dot:#d9a52c;
 --behind:#fcecea;--behind-2:#f6d3cf;--behind-ink:#8f1d14;--behind-dot:#dc6b60;
 --none:#f3f4f8;--none-2:#e4e7ee;--none-ink:#5a6375;--none-dot:#b3bbc8;
 --fs:1rem}
body{background:var(--bg);min-height:100vh}
.bd{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
/* ---------- Top ---------- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.mark{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none;flex:none}
.mark .badge{width:40px;height:40px;background:#fff;box-shadow:var(--shadow)}
.mark .wm{font-size:1.2rem}
.ttl{flex:1 1 280px;min-width:0}
.ttl h1{font-size:1.6rem}
.ttl p{margin:2px 0 0;color:var(--mute);font-size:.9375rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn svg{width:18px;height:18px;flex:none}
/* ---------- Status chips: the legend and a filter ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
 border-radius:var(--r-pill);padding:7px 14px 7px 12px;font:inherit;font-size:.9375rem;font-weight:650;cursor:pointer;
 transition:background .2s,border-color .2s,box-shadow .2s,transform .15s}
.chip:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.chip:active{transform:scale(.97)}
.chip b{font-weight:800;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff}
.chip.on i,.st.on i{background:var(--on-dot)}.chip.slow i,.st.slow i{background:var(--slow-dot)}
.chip.behind i,.st.behind i{background:var(--behind-dot)}.chip.none i,.st.none i{background:var(--none-dot)}
/* ---------- Filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.8125rem;font-weight:700;color:var(--mute)}
.filters select,.filters input{font:inherit;font-size:.9375rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
 border-radius:var(--r);min-height:40px;padding:0 12px}
.filters select{padding-right:32px}
.filters .q{flex:1 1 220px}
.filters .q input{width:100%}
.count{margin-left:auto;color:var(--mute);font-size:.875rem;padding-bottom:10px}
/* ---------- The table ---------- */
.tcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow:auto;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs)}
th,td{text-align:left;padding:9px 12px;vertical-align:middle}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);font-size:.75rem;font-weight:800;
 color:var(--mute);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;padding:0}
thead th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:4px;width:100%;padding:12px;cursor:pointer;line-height:1.25;white-space:normal}
thead th button:hover{color:var(--ink)}
thead th button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
thead th .ar{opacity:0;transition:opacity .2s,transform .2s;font-size:.875rem}
thead th[aria-sort] .ar{opacity:1;color:var(--navy)}
thead th[aria-sort="descending"] .ar{transform:rotate(180deg)}
.n{text-align:right}
thead th.n button{justify-content:flex-end;text-align:right}
tbody tr{background:var(--rowbg,#fff);transition:background .25s}
tbody td,tbody th{border-bottom:1px solid rgba(28,34,48,.06);font-weight:inherit}
tbody tr:last-child>*{border-bottom:0}
tbody tr>:first-child{box-shadow:inset 6px 0 0 var(--bar,transparent);padding-left:20px}
tr.on{--rowbg:var(--on);--bar:var(--on-dot)}
tr.slow{--rowbg:var(--slow);--bar:var(--slow-dot)}
tr.behind{--rowbg:var(--behind);--bar:var(--behind-dot)}
tr.none{--rowbg:#fff;--bar:var(--none-dot)}
tbody tr:hover{filter:brightness(.985)}
.nm{display:block;font-weight:750;color:var(--ink);line-height:1.25;white-space:nowrap}
.cl{display:block;font-size:.8125rem;color:var(--mute);font-weight:500;white-space:nowrap}
.st{display:flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;margin-top:2px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%}
tr.on .st{color:var(--on-ink)}tr.slow .st{color:var(--slow-ink)}tr.behind .st{color:var(--behind-ink)}tr.none .st{color:var(--none-ink)}
.wk{display:inline-block;border-radius:var(--r-pill);padding:4px 12px;font-weight:800;white-space:nowrap;font-size:.9375rem}
tr.on .wk{background:var(--on-2);color:var(--on-ink)}tr.slow .wk{background:var(--slow-2);color:var(--slow-ink)}
tr.behind .wk{background:var(--behind-2);color:var(--behind-ink)}tr.none .wk{background:var(--none-2);color:var(--none-ink)}
.big{font-weight:800;font-size:1.0625rem;font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-weight:750;font-variant-numeric:tabular-nums}
.rate s{display:block;width:56px;height:6px;border-radius:3px;background:rgba(28,34,48,.1);overflow:hidden;text-decoration:none}
.rate s i{display:block;height:100%;border-radius:3px;background:var(--navy);transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.lv{font-weight:700;white-space:nowrap}
.dt{white-space:nowrap;color:var(--ink-2)}
.dash{color:var(--mute)}
.fb{min-width:180px;max-width:300px;font-size:.875rem;color:var(--ink-2);line-height:1.4}
.fb small{display:block;color:var(--mute);font-size:.75rem;margin-top:2px}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:1.0625rem;margin-bottom:4px}
.note{margin:12px 4px 0;color:var(--mute);font-size:.8125rem}
.msg{max-width:520px;margin:12vh auto;text-align:center;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:32px}
.msg h1{margin-bottom:8px}
/* Rows arrive with a soft rise and fade. */
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
tbody tr.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes fade{from{opacity:0}}
.bd{animation:fade .4s ease both}
/* ---------- Whiteboard mode: big type, no controls, the status chips stay as the legend ---------- */
body.wb{--fs:clamp(1rem,1.15vw,1.6rem)}
body.wb .bd{max-width:none;padding:2vh 2vw}
body.wb .filters,body.wb .acts .hide-wb,body.wb .note{display:none}
body.wb .ttl h1{font-size:clamp(1.6rem,2.4vw,3rem)}
body.wb .ttl p{font-size:clamp(.95rem,1.1vw,1.4rem)}
body.wb .chip{font-size:clamp(.95rem,1.05vw,1.4rem);cursor:default;pointer-events:none}
body.wb .chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
body.wb thead th{font-size:clamp(.75rem,.8vw,1.1rem)}
body.wb .nm{font-size:1.1em}
body.wb .cl,body.wb .st,body.wb .fb,body.wb .fb small{font-size:.85em}
body.wb .wk,body.wb .big{font-size:1em}
body.wb .scroll{max-height:calc(100vh - 21vh);max-height:calc(100dvh - 21vh)}
/* ---------- Phones: each student is a card ---------- */
@media (max-width:820px){
 .bd{padding:14px 16px 32px}
 .ttl h1{font-size:1.35rem}
 .acts .btn{min-height:38px;padding:0 14px}
 .chips{gap:6px}
 .chip{font-size:.875rem;padding:6px 12px 6px 10px}
 .filters label{flex:1 1 140px}
 .filters select{width:100%}
 .count{width:100%;margin:0;padding:0}
 .tcard{background:none;box-shadow:none;overflow:visible}
 .scroll{max-height:none;overflow:visible}
 table,tbody{display:block}
 thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;padding:12px 14px 14px;margin-bottom:10px;border-radius:var(--r);
  border-left:6px solid var(--bar);box-shadow:var(--shadow)}
 tbody td,tbody th{display:block;padding:0;border:0}
 tbody tr>:first-child{grid-column:1/3;box-shadow:none;padding:0}
 tbody td[data-l]::before{content:attr(data-l);display:block;font-size:.625rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:1px;line-height:1.3}
 tbody td.wkc{grid-column:3;justify-self:end;align-self:start}
 tbody td.wkc::before{display:none!important}
 .wk{font-size:.875rem;padding:3px 10px}
 .big{font-size:1rem}
 .rate s{width:40px}
 .dt,.lv{font-size:.9375rem}
 td.n,.rate{text-align:left;justify-content:flex-start}
 td.fbc{grid-column:1/-1}
 .fb{max-width:none}
}
/* ---------- Students view: one tile per student, in groups by their last pass, the most recent first ---------- */
.view{display:inline-flex;background:var(--sunk);border-radius:var(--r-pill);padding:3px;gap:2px;align-self:flex-end}
.view button{all:unset;cursor:pointer;padding:8px 16px;border-radius:var(--r-pill);font-weight:700;font-size:.9375rem;color:var(--mute);transition:background .2s,color .2s,box-shadow .2s}
.view button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(28,34,48,.12)}
.view button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.eb{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow)}
.groups{display:flex;flex-direction:column;gap:26px}
.grp h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:1.25rem;font-weight:800;color:var(--ink)}
.grp h2 i{align-self:center;width:12px;height:12px;border-radius:50%;flex:none}
.grp h2 small{font-size:.9375rem;font-weight:600;color:var(--mute)}
.grp.on h2 i{background:var(--on-dot)}.grp.slow h2 i{background:var(--slow-dot)}.grp.behind h2 i{background:var(--behind-dot)}.grp.none h2 i{background:var(--none-dot)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--tb);border-radius:18px;padding:16px 18px;min-width:0;box-shadow:inset 0 0 0 1px var(--tl)}
.grp.on .tile{--tb:var(--on);--tl:var(--on-2);--ti:var(--on-ink)}
.grp.slow .tile{--tb:var(--slow);--tl:var(--slow-2);--ti:var(--slow-ink)}
.grp.behind .tile{--tb:var(--behind);--tl:var(--behind-2);--ti:var(--behind-ink)}
.grp.none .tile{--tb:#fff;--tl:var(--line);--ti:var(--none-ink)}
.tile .tn{font-size:1.1875rem;font-weight:800;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tc{display:block;font-size:.8125rem;font-weight:500;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tf{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.tile .tlv{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tlv b{display:inline-block;align-self:flex-start;background:#fff;color:var(--ti);border-radius:var(--r-pill);padding:3px 11px;font-size:.9375rem;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile .tlv span{font-size:.8125rem;color:var(--ink-2);padding-left:2px}
.tile .tp{text-align:right;line-height:1;flex:none}
.tile .tp b{display:block;font-size:1.75rem;font-weight:850;color:var(--ti);font-variant-numeric:tabular-nums}
.tile .tp span{font-size:.75rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.tile.in{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
body.sv .tcard,body.sv #chips,body.dv #cards{display:none}
body.wb .view{display:none}
body.wb .tiles{grid-template-columns:repeat(auto-fill,minmax(max(210px,12.5vw),1fr));gap:1vw}
body.wb .tile{padding:1.4vh 1.1vw;border-radius:1.4vw}
body.wb .tile .tn{font-size:clamp(1.1rem,1.35vw,2rem)}
body.wb .tile .tlv b{font-size:clamp(.9rem,1vw,1.5rem)}
body.wb .tile .tlv span,body.wb .tile .tc{font-size:clamp(.8rem,.85vw,1.2rem)}
body.wb .tile .tp b{font-size:clamp(1.6rem,2vw,3rem)}
body.wb .grp h2{font-size:clamp(1.2rem,1.5vw,2.2rem)}
body.wb .grp h2 small{font-size:.7em}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:12px 13px;border-radius:14px}.tile .tn{font-size:1rem}
 .tile .tlv b{font-size:.8125rem;padding:2px 9px}.tile .tp b{font-size:1.375rem}.tile .tf{flex-wrap:wrap}.grp h2{font-size:1.0625rem}.view{width:100%}.view button{flex:1;text-align:center}}
@media (prefers-reduced-motion:reduce){tbody tr.in,.bd,.tile.in{animation:none}.rate s i{transition:none}}
</style>
</head>
<body class="sv">
<div class="bd" id="app" aria-busy="true">
 <div class="top">
  <a class="mark" id="home" href="/"><span class="badge"><img src="/logo.png" alt="" width="34" height="34"></span><b class="wm" translate="no">My<span>Safar</span></b></a>
  <div class="ttl"><h1 id="title">Memorisation progress</h1><p id="sub">Loading…</p></div>
  <div class="acts">
   <button type="button" class="btn" id="wbBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/></svg><span>Whiteboard</span></button>
   <a class="btn hide-wb" id="share" href="/admin/board" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Share links</a>
   <a class="btn hide-wb" id="back" href="/" hidden>Back to MySafar</a>
  </div>
 </div>
 <ul class="chips" id="chips" aria-label="Show students who are"></ul>
 <div class="filters" id="filters">
  <label id="fClassL">Class<select id="fClass"></select></label>
  <label id="fStageL">Stage<select id="fStage"><option value="">All years</option><option value="primary">Primary Years</option><option value="secondary">Secondary Years</option></select></label>
  <label id="fYearL">Year group<select id="fYear"></select></label>
  <label class="q">Search<input id="fQ" type="search" placeholder="Type a name" autocomplete="off"></label>
  <div class="view" role="group" aria-label="Show"><button type="button" data-v="s" aria-pressed="true">Students</button><button type="button" data-v="d" aria-pressed="false">Details</button></div>
  <span class="count" id="count" role="status" aria-live="polite"></span>
 </div>
 <div class="groups" id="cards"></div>
 <div class="tcard"><div class="scroll" id="scroll"><table>
  <thead><tr id="head"></tr></thead>
  <tbody id="rows"></tbody>
 </table></div></div>
 <p class="note" id="note"></p>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var LINK=location.pathname!=="/board",SRC=LINK?location.pathname.replace(/\/$/,"")+"/data":"/api/board";
var D=null,F={status:"",cls:"",stage:"",year:"",q:""},SORT={k:"levelDate",dir:-1},FIRST=true,VIEW="s";
/* The Students view's groups, in order: by the weeks since the last pass, then no pass yet. */
var GROUPS=[["on","This week",function(w){return w===0}],["on","Last week",function(w){return w===1}],["slow","2 weeks ago",function(w){return w===2}],
 ["behind","3 or more weeks ago",function(w){return w!=null&&w>=3}],["none","No pass yet",function(w){return w==null}]];
var STATUS=[["on","On track","Passed this week or last week"],["slow","Slowing down","Last pass two weeks ago"],
 ["behind","Needs support","No pass for three weeks or more, or no pass yet"],["none","Not started","Nothing recorded yet"]];
var LABEL={};STATUS.forEach(function(s){LABEL[s[0]]=s[1]});
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function day(d){if(!d)return '<span class="dash" aria-label="None">–</span>';var p=d.split("-");
 return '<span class="dt">'+(+p[2])+" "+MON[+p[1]-1]+(p[0]!==D.today.slice(0,4)?" "+p[0]:"")+'</span>'}
function weeks(w){return w==null?"No pass yet":w===0?"This week":w===1?"1 week":w+" weeks"}
function yearName(y){return y===0?"Reception":"Year "+y}
/* The columns: key, heading, numeric, cell. Fails, pass rate and feedback are left out on a link made without them. */
function cols(){var C=[
 ["name","Student name",0,function(s){return '<div><span class="nm">'+esc(s.name)+'</span>'+(showClass()?'<span class="cl">'+esc(s["class"])+'</span>':'')
   +'<span class="st '+s.status+'"><i aria-hidden="true"></i>'+LABEL[s.status]+'</span></div>'}],
 ["weeks","Weeks since last pass",0,function(s){return '<span class="wk">'+weeks(s.weeks)+'</span>'},"wkc"],
 ["passes","Total passes",1,function(s){return '<span class="big">'+s.passes+'</span>'}]];
 if(D.fails)C.push(["fails","Total fails",1,function(s){return '<span class="big">'+s.fails+'</span>'}],
  ["rate","Memo pass rate %",1,function(s){return s.rate==null?'<span class="dash">–</span>':'<span class="rate">'+s.rate+'%<s aria-hidden="true"><i style="transform:scaleX('+(s.rate/100)+')"></i></s></span>'}]);
 C.push(["tested","Last tested date",0,function(s){return day(s.tested)}],
  ["level","Last level passed",0,function(s){return s.level?'<span class="lv">'+esc(s.level)+'</span>':'<span class="dash">–</span>'}],
  ["levelDate","Date of last level passed",0,function(s){return day(s.levelDate)}]);
 if(D.fails)C.push(["failDate","Date of last fail",0,function(s){return day(s.failDate)}],
  ["feedback","Last tester feedback",0,function(s){return s.feedback?'<div class="fb">'+esc(s.feedback)+'<small>'+(s.feedbackOk?"Passed":"Not passed")+', '+day(s.feedbackDate).replace(/<[^>]+>/g,"")+'</small></div>':'<span class="dash">–</span>'},"fbc"]);
 return C}
/* A tile holds the key points: name, the last target or surah passed and when, and the total passes. */
function tiles(A){var n=0,many=showClass();
 var h=GROUPS.map(function(g){var L=A.filter(function(s){return g[2](s.weeks)}).sort(function(a,b){return (b.levelDate||"").localeCompare(a.levelDate||"")||a.name.localeCompare(b.name)});
  if(!L.length)return "";
  return '<section class="grp '+g[0]+'"><h2><i aria-hidden="true"></i>'+g[1]+' <small>'+L.length+(L.length===1?" student":" students")+'</small></h2><ul class="tiles">'+L.map(function(s){var i=n++;
   var last=s.level?'<b>'+esc(s.level)+'</b><span>'+(s.weeks>=3?weeks(s.weeks)+" ago":day(s.levelDate).replace(/<[^>]+>/g,""))+'</span>'
    :'<b>'+esc(s.target?"Working on "+s.target:"Ready to start")+'</b>';
   return '<li class="tile'+(FIRST?' in':'')+'"'+(FIRST&&i<48?' style="--d:'+(i*0.02).toFixed(3)+'s"':'')+'><div><div class="tn">'+esc(s.name)+'</div>'+(many?'<span class="tc">'+esc(s["class"])+'</span>':'')+'</div>'
    +'<div class="tf"><div class="tlv">'+last+'</div><div class="tp"><b>'+s.passes+'</b><span>'+(s.passes===1?"pass":"passes")+'</span></div></div></li>'}).join("")+'</ul></section>'}).join("");
 return h||'<div class="empty eb"><b>No students to show</b>'+(D.students.length?'Try another class or year group.':'Students appear here once they are added to a class.')+'</div>'}
function setView(v){VIEW=v==="d"?"d":"s";document.body.classList.toggle("sv",VIEW==="s"||document.body.classList.contains("wb"));document.body.classList.toggle("dv",VIEW==="d"&&!document.body.classList.contains("wb"));
 document.querySelectorAll(".view button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===VIEW)})}
function showClass(){return !F.cls&&D.classes.length>1}
function val(s,k){var v=s[k];if(k==="weeks")return v==null?1e9:v;if(k==="name")return v.toLowerCase();if(k==="feedback")return (v||"").toLowerCase();return v==null?"":v}
function list(){var q=F.q.trim().toLowerCase();
 return D.students.filter(function(s){return (!F.cls||s.cid===F.cls)&&(!F.stage||s.stage===F.stage)&&(F.year===""||String(s.year)===F.year)&&(!q||s.name.toLowerCase().indexOf(q)>=0)})}
function sorted(A){var k=SORT.k,dir=SORT.dir,num=k==="passes"||k==="fails"||k==="rate"||k==="weeks";
 return A.slice().sort(function(a,b){var x=val(a,k),y=val(b,k);
  if(x===""&&y!=="")return 1;if(y===""&&x!=="")return -1;
  var c=num?(x===""?0:x)-(y===""?0:y):String(x).localeCompare(String(y),undefined,{numeric:true});
  return c*dir||a.name.localeCompare(b.name)})}
function render(){var C=cols(),A=list(),counts={on:0,slow:0,behind:0,none:0};A.forEach(function(s){counts[s.status]++});
 $("chips").innerHTML='<li><button type="button" class="chip" data-s="" aria-pressed="'+(F.status==="")+'"><i aria-hidden="true"></i>All <b>'+A.length+'</b></button></li>'
  +STATUS.map(function(st){return '<li><button type="button" class="chip '+st[0]+'" data-s="'+st[0]+'" aria-pressed="'+(F.status===st[0])+'" title="'+st[2]+'"><i aria-hidden="true"></i>'+st[1]+' <b>'+counts[st[0]]+'</b></button></li>'}).join("");
 if(F.status)A=A.filter(function(s){return s.status===F.status});
 $("head").innerHTML=C.map(function(c){var on=SORT.k===c[0];return '<th scope="col"'+(c[2]?' class="n"':'')+(on?' aria-sort="'+(SORT.dir>0?"ascending":"descending")+'"':'')+'><button type="button" data-k="'+c[0]+'">'+c[1]+'<span class="ar" aria-hidden="true">▲</span></button></th>'}).join("");
 var rows=sorted(A);
 $("rows").innerHTML=rows.length?rows.map(function(s,i){return '<tr class="'+s.status+(FIRST?' in':'')+'"'+(FIRST&&i<40?' style="--d:'+(i*0.025).toFixed(3)+'s"':'')+'>'+C.map(function(c,j){
   return (j?'<td':'<th scope="row"')+(c[2]?' class="n"':c[4]?' class="'+c[4]+'"':'')+(j?' data-l="'+c[1]+'"':'')+'>'+c[3](s)+(j?'</td>':'</th>')}).join("")+'</tr>'}).join("")
  :'<tr><td colspan="'+C.length+'" class="empty"><b>No students to show</b>'+(D.students.length?'Try another class, year group or status.':'Students appear here once they are added to a class.')+'</td></tr>';
 $("cards").innerHTML=tiles(list().filter(function(s){return !F.status||VIEW==="s"||s.status===F.status}));
 FIRST=false;
 $("count").textContent=rows.length+(rows.length===1?" student":" students");
 var scope=F.cls||D.fixedClass?(D.classes.filter(function(c){return c.id===F.cls})[0]||D.classes[0]||{}).label:F.year!==""?yearName(+F.year):F.stage==="primary"?"Primary Years":F.stage==="secondary"?"Secondary Years":D.scope||(D.mode==="staff"&&!D.admin?"Your classes":"Whole school");
 $("title").textContent=scope;$("sub").textContent="Memorisation progress · updated "+D.updated;
 document.title=(scope?scope+" · ":"")+"Memo board · MySafar";
 save()}
function fill(){var cs=$("fClass"),ys=$("fYear"),years={};
 cs.innerHTML='<option value="">'+(D.mode==="staff"&&!D.admin?"All your classes":"All classes")+'</option>'+D.classes.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.label)+'</option>'}).join("");
 D.students.forEach(function(s){if(s.year!=null)years[s.year]=1});
 ys.innerHTML='<option value="">All year groups</option>'+Object.keys(years).map(Number).sort(function(a,b){return a-b}).map(function(y){return '<option value="'+y+'">'+yearName(y)+'</option>'}).join("");
 var stages={};D.classes.forEach(function(c){stages[c.stage]=1});
 $("fClassL").hidden=D.classes.length<2||D.fixedClass;$("fStageL").hidden=Object.keys(stages).length<2;$("fYearL").hidden=Object.keys(years).length<2;
 if(F.cls&&!D.classes.some(function(c){return c.id===F.cls}))F.cls="";
 cs.value=F.cls;$("fStage").value=F.stage;ys.value=F.year;if(ys.value!==F.year)F.year="";$("fQ").value=F.q;
 $("share").hidden=!D.admin;$("back").hidden=LINK;$("home").href=LINK?"#":"/";if(LINK)$("home").removeAttribute("href");
 $("note").textContent="Most recent passes first. On track: passed this week or last week. Slowing down: last pass two weeks ago. Needs support: no pass for three weeks or more, or no pass yet."
  +(D.fails?" Pass rate is passes out of every memo test, passed or not.":"")+" The board refreshes itself every two minutes."}
/* The chosen filters and Whiteboard mode are kept in the address (#class=...&wb=1), so a bookmark opens the same view,
   and in this browser for next time. */
var KEY="memoBoard:"+location.pathname;
function save(){var p=[];if(F.cls)p.push("class="+encodeURIComponent(F.cls));if(F.stage)p.push("stage="+F.stage);if(F.year!=="")p.push("year="+F.year);
 if(F.status)p.push("status="+F.status);if(VIEW==="d")p.push("view=details");if(document.body.classList.contains("wb"))p.push("wb=1");
 var h=p.length?"#"+p.join("&"):"";if(location.hash!==h)history.replaceState(null,"",location.pathname+location.search+h);
 try{localStorage.setItem(KEY,h)}catch(e){}}
function restore(){var h=location.hash;if(!h){try{h=localStorage.getItem(KEY)||""}catch(e){h=""}}
 h.replace(/^#/,"").split("&").forEach(function(kv){var p=kv.split("="),v=decodeURIComponent(p[1]||"");
  if(p[0]==="class")F.cls=v;else if(p[0]==="stage"&&/^(primary|secondary)$/.test(v))F.stage=v;else if(p[0]==="year"&&/^\d+$/.test(v))F.year=v;
  else if(p[0]==="status"&&LABEL[v])F.status=v;else if(p[0]==="view"&&v==="details")VIEW="d";else if(p[0]==="wb"&&v==="1")document.body.classList.add("wb")});
 wbLabel();setView(VIEW)}
function wbLabel(){var on=document.body.classList.contains("wb");$("wbBtn").querySelector("span").textContent=on?"Exit whiteboard":"Whiteboard";$("wbBtn").setAttribute("aria-pressed",on)}
function load(){fetch(SRC,{credentials:"same-origin",headers:{Accept:"application/json"}}).then(function(r){
  if(r.status===401){location.href="/login?next="+encodeURIComponent("/board");throw 0}
  if(r.status===404){stop("This board link is turned off","Ask an administrator for a new link to the memorisation progress board.");throw 0}
  if(!r.ok)throw new Error(r.status);return r.json()}).then(function(data){var first=!D;D=data;if(first){restore()}fill();render();$("app").removeAttribute("aria-busy")})
 .catch(function(e){if(e!==0&&!D)stop("The board couldn't load","Check the connection and reload the page.")})}
function stop(h,p){clearInterval(T);document.body.innerHTML='<div class="msg"><h1>'+esc(h)+'</h1><p class="sub">'+esc(p)+'</p></div>'}
$("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;F.status=b.dataset.s;render()});
$("head").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var k=b.dataset.k;
 SORT=SORT.k===k?{k:k,dir:-SORT.dir}:{k:k,dir:k==="passes"||k==="rate"||/Date$|tested/.test(k)?-1:1};render();
 var n=$("head").querySelector('[data-k="'+k+'"]');if(n)n.focus()});
$("fClass").addEventListener("change",function(){F.cls=this.value;render()});
$("fStage").addEventListener("change",function(){F.stage=this.value;render()});
$("fYear").addEventListener("change",function(){F.year=this.value;render()});
$("fQ").addEventListener("input",function(){F.q=this.value;render()});
document.querySelector(".view").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;setView(b.dataset.v);render()});
$("wbBtn").addEventListener("click",function(){var on=document.body.classList.toggle("wb");wbLabel();setView(VIEW);save();
 try{if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});
  else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.body.classList.contains("wb")&&!document.fullscreenElement){document.body.classList.remove("wb");wbLabel();setView(VIEW);save()}});
/* On a whiteboard nobody scrolls, so a board taller than the screen turns its own pages: every 12 seconds it moves on
   a screenful, and after the last it goes back to the top. */
setInterval(function(){if(!document.body.classList.contains("wb"))return;var sv=document.body.classList.contains("sv"),el=sv?document.scrollingElement:$("scroll"),
  step=sv?innerHeight-120:el.clientHeight-$("head").offsetHeight-8;
 if(el.scrollHeight-el.clientHeight<4)return;var smooth=!matchMedia("(prefers-reduced-motion: reduce)").matches?"smooth":"auto";
 el.scrollTo({top:el.scrollTop+el.clientHeight>=el.scrollHeight-4?0:el.scrollTop+step,behavior:smooth})},12000);
var T=setInterval(load,120000);
load()})();
</script>
