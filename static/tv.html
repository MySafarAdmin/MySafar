<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png?v=3">
<link rel="apple-touch-icon" href="/favicon.png?v=3">
<title>Safar Academy · Live</title>
<style>
@font-face{font-family:"Atkinson Next";src:url(/fonts/atkinson-next-latin.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* Student-facing display. Every slide is a still from an Islamic place or story (the Kaaba in the Prophet's time,
   Masjid an-Nabawi, Al-Aqsa, Cave Hira, Cave Thawr, the Ark, the parting of the sea, the split moon) that keeps moving
   while it is on: washing and trees in the wind, water, light. On the Presenter the class's students ride through by name. Slides change every
   30 seconds with a crossfade and a slow push in, so the screen never cuts. Everything is sized in vh for a 16:9 TV. */
:root{--navy:#002848;--ink:#0b2340;--mute:#5b7089;--gold:#f5c542;--gold2:#d99a00;--silver:#dfe6ee;--silver2:#9fb0c2;--bronze:#efaa72;--bronze2:#b86a2e;
 --makkah:#e9a400;--aqsa:#2a9fe6;--madinah:#1fae72;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:"Atkinson Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0;overflow:hidden}
/* ---------- Slides and the change between them ---------- */
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.06);transition:opacity 1.4s ease,transform 2.2s cubic-bezier(.2,.7,.2,1)}
.slide.on{opacity:1;transform:none}
.slide.out{opacity:0;transform:scale(1.035);transition:opacity 1.2s ease,transform 1.4s ease-in}
.slide:not(.on) *,.slide.out *{animation-play-state:paused!important}
.scene{position:absolute;inset:0}
.scene svg.land{position:absolute;left:0;bottom:0;width:100%;height:100%}
.carriers{position:absolute;inset:0;pointer-events:none;z-index:0} /* behind the podium and lists, so nothing covers a name */
.content>*{position:relative;z-index:1}.content>.title{z-index:3}
.content{position:absolute;inset:13vh 3vw 3.4vh;display:flex;flex-direction:column}
/* ---------- Header ---------- */
header{position:fixed;z-index:5;top:2.2vh;left:2.4vw;right:2.4vw;display:flex;align-items:center;gap:1.4vw;pointer-events:none}
.brand{display:flex;align-items:center;gap:1vw;background:var(--navy);border-radius:99px;padding:.8vh 2vw .8vh .8vh;box-shadow:0 .6vh 0 rgba(0,20,40,.25)}
.badge{width:7vh;height:7vh;border-radius:50%;background:#fff;display:grid;place-items:center}
.badge img{width:6vh;height:6vh}
.brand h1{margin:0;font-size:3.4vh;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.brand h1 small{display:block;font-size:1.9vh;font-weight:600;color:#bcd2e8;letter-spacing:0}
.mode{background:var(--gold);color:#2b1d00;font-weight:800;font-size:2.3vh;border-radius:99px;padding:.9vh 1.6vw}
.mode:empty{display:none}
.spacer{flex:1}
.dots{display:flex;gap:.9vh;background:var(--navy);border-radius:99px;padding:1.1vh 1.2vw}
.dots i{width:1.4vh;height:1.4vh;border-radius:50%;background:rgba(255,255,255,.35);transition:background .6s,transform .6s}
.dots i.on{background:var(--gold);transform:scale(1.35)}
.clock{font-size:4.4vh;font-weight:800;background:var(--navy);border-radius:99px;padding:.6vh 1.6vw;box-shadow:0 .6vh 0 rgba(0,20,40,.25)}
footer{position:fixed;z-index:5;left:0;right:0;bottom:0;height:.9vh;background:rgba(0,40,72,.5)}
footer i{display:block;height:100%;width:0;background:var(--gold)}
footer i.run{width:100%;transition:width linear}
/* ---------- Titles ---------- */
.title{align-self:flex-start;background:var(--navy);border-radius:2.4vh;padding:1.4vh 2.6vw 1.5vh;box-shadow:0 .8vh 0 rgba(0,20,40,.25);animation:drop 1s .35s both cubic-bezier(.2,.9,.3,1.2)}
.title h2{margin:0;font-size:6.4vh;font-weight:800;letter-spacing:-.015em;line-height:1.05}
.title .stage{display:block;font-size:4.8vh;font-weight:800;color:var(--gold);line-height:1.1;margin-top:.3vh}
.title p{margin:.6vh 0 0;font-size:3.3vh;font-weight:700;color:#e3eef8}
.title .pg{color:var(--gold);margin-left:1vw}
@keyframes drop{from{opacity:0;transform:translateY(-3vh)}}
/* ---------- Podium ---------- */
/* The podium stands in the middle of the screen on a flat base, rather than on the bottom edge. */
.podium{flex:1 1 0;min-height:0;max-height:62vh;margin:2vh 0 5vh;position:relative;display:grid;grid-template-columns:24vw 28vw 24vw;grid-template-rows:minmax(0,1fr);justify-content:center;align-items:end;gap:0 1vw}
.podium:after{content:"";position:absolute;left:calc(50% - 39.5vw);right:calc(50% - 39.5vw);bottom:-1.8vh;height:1.8vh;border-radius:1vh;background:rgba(0,30,60,.3)}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;min-height:0}
.p1.col{padding-top:6.6vh} /* room for the crown */
.col>.who,.col>.step{flex:none}
.who{display:flex;flex-direction:column;gap:1vh;align-items:stretch;margin-bottom:1.6vh;position:relative}
.pc{background:#fff;color:var(--ink);border-radius:2vh;padding:1.4vh 1vw 1.5vh;text-align:center;box-shadow:0 .7vh 0 rgba(0,20,40,.22);border-bottom:.7vh solid var(--hc,#c9d6e3);animation:pop .7s both cubic-bezier(.3,1.6,.5,1)}
.pc .pn{display:block;font-size:4.2vh;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.pc .pcl{display:block;font-size:2.3vh;font-weight:600;color:var(--mute);margin-top:.3vh}
.p1 .pc .pn{font-size:5vh}
/* A class card celebrates its teacher: their name is the big line, the year group sits under it. */
.pc.cls .pn{font-size:5.2vh;white-space:nowrap;overflow-wrap:normal}.p1 .pc.cls .pn{font-size:6.2vh}
.pc.cls .pcl{font-size:3vh;font-weight:700;color:var(--mute)}
.more{text-align:center;font-weight:800;font-size:2.4vh;background:rgba(0,40,72,.8);border-radius:99px;padding:.6vh 1vw;animation:pop .7s both}
.step{position:relative;border-radius:2vh 2vh 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1.6vh;color:#2b1d00;overflow:hidden;
 box-shadow:inset 0 1.4vh 0 rgba(255,255,255,.35),inset 0 -2.2vh 0 rgba(0,0,0,.1),0 .8vh 0 rgba(0,20,40,.22);animation:rise 1.1s both cubic-bezier(.2,.9,.25,1.1);transform-origin:bottom}
.step b{font-size:9vh;font-weight:800;line-height:1}
.step span{font-size:2.6vh;font-weight:800;margin-top:.4vh;opacity:.85}
.p1 .step{height:24vh;background:var(--gold)}
.p2 .step{height:18vh;background:var(--silver);color:#26313d}
.p3 .step{height:14.5vh;background:var(--bronze);color:#3a1c05}
.p3 .step b{font-size:7vh}
.step.none{opacity:.45}
/* The steps rise in order: first place, then second, then third, each step before its names. First place then
   keeps a crown bobbing and light sweeping over the gold. */
.p1 .step{animation-delay:.4s}.p1 .pc,.p1 .more{animation-delay:.9s}
.p2 .step{animation-delay:1.6s}.p2 .pc,.p2 .more{animation-delay:2.1s}
.p3 .step{animation-delay:2.8s}.p3 .pc,.p3 .more{animation-delay:3.3s}
.p1 .step::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3);clip-path:polygon(30% 0,42% 0,22% 100%,10% 100%);transform:translateX(-120%);animation:sweep 4.5s 2.4s infinite}
.p1 .who{animation:float 4s 2s ease-in-out infinite}
.crown{position:absolute;left:50%;top:-6.4vh;width:8vh;margin-left:-4vh;animation:pop .8s 1.3s both cubic-bezier(.3,1.6,.5,1)}
.crown svg{width:100%;display:block;animation:bob 2.6s 2.5s ease-in-out infinite}
.spark{position:absolute;width:2.4vh;height:2.4vh;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.2s infinite}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(3vh)}}
@keyframes sweep{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
@keyframes float{50%{transform:translateY(-1vh)}}
@keyframes bob{50%{transform:translateY(-.8vh) rotate(-4deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
/* ---------- Memorisation and book passes board ----------
   One navy board. Each rank is a band: its place and score on the left, then the students in a grid of boxes that
   are all the same size. A month too full for the board scrolls band by band (fitRanks). */
.ranks{flex:0 1 auto;min-height:0;margin:2.6vh 0 3vh;position:relative;overflow:hidden;font-size:3.6vh;background:var(--navy);border-radius:2.4vh;border:.5vh solid var(--navy);box-shadow:0 .8vh 0 rgba(0,20,40,.25);animation:pop .8s .3s both cubic-bezier(.3,1.4,.5,1)}
.rk-in{will-change:transform}
.rk{display:grid;grid-template-columns:5.2em 1fr;gap:.5em;padding:.5em .55em;border-bottom:.12em solid rgba(255,255,255,.12)}
.rk:last-child{border-bottom:0}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;height:2.6em;border-radius:.4em;background:rgba(255,255,255,.14);color:#fff}
.rb b{font-size:1.15em;font-weight:800;line-height:1}
.rb span{font-size:.46em;font-weight:800;opacity:.85;margin-top:.15em}
.m1 .rb{background:var(--gold);color:#2b1d00}.bk .rb{background:#e9604f;color:#fff}.m2 .rb{background:var(--silver);color:#26313d}.m3 .rb{background:var(--bronze);color:#3a1c05}
.rw{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:.36em}
.chip{height:2.6em;display:flex;flex-direction:column;justify-content:center;background:#fff;color:var(--ink);border-radius:.4em;padding:0 .6em;border-left:.24em solid var(--hc,#c9d6e3);line-height:1.15;min-width:0}
.chip .pn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .pcl{font-size:.52em;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- House podium: every house gets its own step, logo, name, rank and points ---------- */
.hp .pc{padding:2vh 1vw 2.2vh;border-bottom-width:1vh}
.hp .logo{display:block;width:13vh;height:13vh;margin:0 auto 1vh}
.hp .p1 .logo{width:16vh;height:16vh}
.hp .pc .pn{font-size:5.4vh}.hp .p1 .pc .pn{font-size:6.4vh}
.hp .step b{font-size:8vh}.hp .step span{font-size:3.2vh}
.hp .p1 .step{height:26vh}.hp .p2 .step{height:20vh}.hp .p3 .step{height:16.5vh}
/* ---------- Scenery parts ---------- */
.ph{transform-box:fill-box;transform-origin:50% 0}.ph.b{transform-origin:50% 100%}
.float{transform-box:fill-box;transform-origin:50% 80%}
.hand{transform-box:view-box;animation:spin linear infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.34}}
.umb{transform-box:fill-box;transform-origin:50% 100%;animation:umb 18s ease-in-out infinite}
@keyframes umb{0%,10%{transform:scale(.14,1.5)}30%,78%{transform:none}94%,100%{transform:scale(.14,1.5)}}
.peck{transform-box:fill-box;transform-origin:30% 100%;animation:peck 4s ease-in-out infinite}
@keyframes peck{0%,70%,100%{transform:none}78%{transform:rotate(-5deg) translateY(-2px)}86%{transform:rotate(3deg)}}
.web{animation:shimmer 3s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.55}to{opacity:1}}
.foam{animation:foam 2s linear infinite}
@keyframes foam{to{stroke-dashoffset:-132}}
.half{transform-box:fill-box;animation:split 16s ease-in-out infinite}
.half.r{animation-name:splitr}
@keyframes split{0%,18%,94%,100%{transform:none}42%,72%{transform:translate(-70px,8px) rotate(-8deg)}}
@keyframes splitr{0%,18%,94%,100%{transform:none}42%,72%{transform:translate(70px,8px) rotate(8deg)}}
.sfish{position:absolute;width:3vh;height:1.6vh;border-radius:50%;opacity:.85;animation:sfish ease-in-out infinite alternate}
.sfish::after{content:"";position:absolute;left:-1.2vh;top:.2vh;border:.6vh solid transparent;border-right:1.2vh solid;border-right-color:inherit;color:inherit}
@keyframes sfish{from{left:var(--l)}to{left:var(--r)}}
/* ---------- Festival scenery ---------- */
.fw{position:absolute;width:0;height:0}
.fw i{position:absolute;left:-.3vh;top:0;width:.6vh;height:4.6vh;border-radius:99px;background:var(--c);transform-origin:50% 0;opacity:0;animation:burst 3.6s ease-out infinite}
@keyframes burst{0%{opacity:0;transform:rotate(var(--r)) translateY(0) scaleY(.2)}12%{opacity:1}65%{opacity:0;transform:rotate(var(--r)) translateY(8vh) scaleY(1)}100%{opacity:0;transform:rotate(var(--r)) translateY(8vh)}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:flag 2.4s ease-in-out infinite alternate}
@keyframes flag{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.fall{position:absolute;top:-4vh;width:1.1vh;height:1.7vh;border-radius:.25vh;animation:fall linear infinite}
@keyframes fall{to{transform:translate(4vw,112vh) rotate(720deg)}}
.empty{margin:auto;background:rgba(0,40,72,.82);border-radius:3vh;padding:4vh 4vw;font-size:4.4vh;font-weight:800;text-align:center;animation:pop .9s .6s both}
.empty small{display:block;font-size:2.6vh;color:#cfe0f0;font-weight:600;margin-top:1vh}
/* ---------- Names that take turns ---------- */
.cycle{flex:1;min-height:0;position:relative;margin:0 0 7vh}
.names{position:absolute;inset:0;display:grid;gap:2vh 1.6vw;align-content:center;justify-content:center}
.names.leave .nc{animation:leave .6s both ease-in}
.nc{background:#fff;color:var(--ink);border-radius:2.4vh;padding:2.2vh 2vw 2.4vh;box-shadow:0 .8vh 0 rgba(0,20,40,.22);border-left:1vh solid var(--hc,#c9d6e3);min-width:0;animation:pop .75s both cubic-bezier(.3,1.5,.5,1)}
.nc .pn{display:block;font-size:1em;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.nc .pcl{display:block;font-size:.5em;font-weight:600;color:var(--mute);margin-top:.4vh}
.nc .wk{display:inline-block;font-size:.45em;font-weight:800;color:#5b4200;background:#ffe9a6;border-radius:99px;padding:.3vh .8vw;margin-top:.8vh}
.names.solo .nc{text-align:center;padding:4vh 5vw;border-left:0;border-bottom:1.2vh solid var(--hc,#c9d6e3);animation:pop 1s both cubic-bezier(.3,1.5,.5,1),float 5s 1.2s ease-in-out infinite}
@keyframes leave{to{opacity:0;transform:scale(.85) translateY(-2vh)}}
.Makkah{--hc:var(--makkah)}.Al-Aqsa{--hc:var(--aqsa)}.Madinah{--hc:var(--madinah)}
/* ---------- Teachers' names riding through ---------- */
.rider{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.rider .tag{background:#fff;color:var(--ink);font-weight:800;font-size:2.4vh;border-radius:99px;padding:.5vh 1.2vw;white-space:nowrap;box-shadow:0 .5vh 0 rgba(0,20,40,.3);margin-top:.4vh}
.rider .tag:empty{display:none}
.rider .art{display:block}
.rider .art{transform-origin:50% 50%;will-change:transform}
.wg{transform-box:view-box;animation:wg .08s ease-in-out infinite alternate}
.flapx{transform-box:fill-box;transform-origin:0 50%;animation:flapx .28s ease-in-out infinite alternate}
.flapx.r{transform-origin:100% 50%}
.wx{transform-box:fill-box;transform-origin:0 50%}.wx.r{transform-origin:100% 50%}
.wing{transform-box:fill-box;transform-origin:30% 100%}.thrust{transform-box:fill-box;transform-origin:100% 50%}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .12s infinite alternate}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.2s linear infinite}
@keyframes wg{from{transform:rotate(-24deg)}to{transform:rotate(30deg) scaleY(.7)}}
@keyframes flapx{to{transform:scaleX(.25)}}
@keyframes flame{to{transform:scaleY(1.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- Scenery that keeps moving ---------- */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.drift{position:absolute;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.cloud{position:absolute;left:0;width:22vw;height:7vh;background:#fff;border-radius:99px}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:9vw;height:9vw;left:3vw;bottom:2vh}.cloud::after{width:6vw;height:6vw;left:10vw;bottom:2.5vh}
.bub{position:absolute;bottom:-4vh;border-radius:50%;border:.25vh solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:up linear infinite}
@keyframes up{to{transform:translate(2vw,-115vh)}}
.ray{position:absolute;top:-20vh;width:9vw;height:120vh;background:rgba(255,255,255,.08);transform-origin:50% 0;animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{transform:rotate(14deg);opacity:.5}to{transform:rotate(22deg);opacity:1}}
.tw{position:absolute;width:.5vh;height:.5vh;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.fly{position:absolute;width:1.1vh;height:1.1vh;border-radius:50%;background:#f4ff7a;outline:.6vh solid rgba(244,255,122,.25);animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0);opacity:.2}30%{opacity:1}100%{transform:translate(6vw,-8vh);opacity:.4}}
.sun{position:absolute;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 2.2vh rgba(255,210,63,.3),0 0 0 4.6vh rgba(255,210,63,.14);animation:glow 4s ease-in-out infinite alternate}
.sun::before{display:none}
@keyframes glow{to{box-shadow:0 0 0 3vh rgba(255,210,63,.3),0 0 0 6.4vh rgba(255,210,63,.12)}}
.wave{position:absolute;left:0;width:200%;animation:wave linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.mist{position:absolute;left:-20vw;width:80vw;height:12vh;border-radius:99px;background:rgba(255,255,255,.18);animation:mist 26s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(60vw)}}
/* A shooting star: a bright head with a long tail that tapers and fades behind it, streaking down along its own
   line (the holder is turned to the angle, the star moves straight along it) and burning out, then a long wait. */
.shoot{position:absolute;width:0;height:0;transform:rotate(var(--a,24deg))}
.shoot b{position:absolute;right:0;top:-.5vh;height:1vh;width:16vw;opacity:0;animation:shoot var(--t,11s) var(--d,0s) linear infinite}
.shoot u{position:absolute;inset:0;transform-origin:100% 50%;animation:tail var(--t,11s) var(--d,0s) linear infinite}
.shoot u::before,.shoot u::after{content:"";position:absolute;right:.5vh;top:0;bottom:0;left:0;background:#fff;clip-path:polygon(0 50%,100% 15%,100% 85%)}
.shoot u::before{opacity:.35;left:-30%;clip-path:polygon(0 50%,100% 0,100% 100%)}
.shoot i{position:absolute;right:-.2vh;top:50%;width:1.3vh;height:1.3vh;margin-top:-.65vh;border-radius:50%;background:#fff;box-shadow:0 0 0 .5vh rgba(255,255,255,.25),0 0 0 1.1vh rgba(190,215,255,.12)}
@keyframes shoot{0%{opacity:0;transform:translateX(0)}1.5%{opacity:1}9%{opacity:1}11%,100%{opacity:0;transform:translateX(46vw)}}
@keyframes tail{0%{transform:scaleX(.05)}5%{transform:scaleX(1)}9%{transform:scaleX(.7)}11%,100%{transform:scaleX(.1)}}
.glowwin{animation:tw 4s ease-in-out infinite}
.confetti{position:absolute;width:1.2vh;height:1.8vh;border-radius:.3vh;pointer-events:none}
#ctl{position:fixed;z-index:8;right:2vw;bottom:3vh;display:flex;gap:.8vw;opacity:0;transition:opacity .4s}
#ctl.on,#ctl:focus-within{opacity:1}
#ctl button{font:inherit;font-size:2.2vh;font-weight:800;color:#fff;background:var(--navy);border:0;border-radius:99px;padding:1.1vh 1.6vw;cursor:pointer;box-shadow:0 .5vh 0 rgba(0,20,40,.3)}
#ctl button.ico{display:grid;place-items:center;width:6vh;height:6vh;padding:0}
#ctl .ico svg{width:3vh;height:3vh}
#ctl .ico .fs-off,#ctl .ico.full .fs-on{display:none}#ctl .ico.full .fs-off{display:block}
#ctl button[hidden]{display:none}
#ctl button:focus-visible{outline:.4vh solid #ffd23f;outline-offset:.3vh}
#off{position:fixed;z-index:9;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--navy);font-size:4vh;font-weight:800;padding:5vw}
@media (prefers-reduced-motion:reduce){
 .slide,.slide.out{transition:opacity .6s}.slide{transform:none}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
 footer i.run{transition:none}.carriers{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<header><div class="brand"><span class="badge"><img src="/logo.png?v=3" alt="" width="80" height="80"></span><h1 id="brand">Safar Academy<small>Enfield</small></h1></div><span class="mode" id="mode"></span><span class="spacer"></span><div class="dots" id="dots"></div><div class="clock" id="clock"></div></header>
<footer><i id="prog"></i></footer>
<div id="off"></div>

<script>
(function(){
var SLIDE_MS=30000,DATA_MS=60000;
/* /presenter/<class> is a teacher's Presenter: the same scenes, for one class, with its students riding through. */
var path=location.pathname.replace(/\/+$/,""),PRESENT=path.indexOf("/presenter/")===0,
 URL=path==="/tv"?"/api/tv":PRESENT?"/api"+path:path+"/data";
/* Test hooks for previews: ?slide=<id> keeps one slide on, ?focus=qaidah or memo plays only those. */
var Q=new URLSearchParams(location.search),PIN=Q.get("slide"),FOCUS=Q.get("focus");
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var data=null,cur=null,curId=null,ST=null,PT=null,RT=null,teach=Math.floor(Math.random()*1e3);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function $(id){return document.getElementById(id)}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(L){return L[Math.floor(Math.random()*L.length)]}
function rep(n,f){var h="";for(var i=0;i<n;i++)h+=f(i);return h}
function plural(n,w){return n+" "+(n===1?w:/s$/.test(w)?w+"es":w+"s")}
function clock(){$("clock").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}

/* Flat bands of colour instead of gradients: [top in vh, colour], each to the bottom of the screen. */
function bands(B){return B.map(function(b){return '<i style="position:absolute;left:0;right:0;bottom:0;top:'+b[0]+'vh;background:'+b[1]+'"></i>'}).join("")}

function stars(n,h){return rep(n,function(){return '<i class="tw" style="left:'+rnd(0,100)+'vw;top:'+rnd(0,h)+'vh;animation-delay:-'+rnd(0,3)+'s;transform:scale('+rnd(.6,1.6)+')"></i>'})}
var LAND='<svg class="land" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">';
/* Things that move with the wind (wind() below): washing on a line, palm fronds, cypresses, the spider's web.
   A hanging piece swings from its top, a tree bends from its foot. */
function ph(inner,k,s,foot){return '<g class="ph'+(foot?' b':'')+'" data-k="'+k+'" data-s="'+s+'">'+inner+'</g>'}
function cloth(x,y,c,kind){var peg='<rect x="'+(x-3)+'" y="'+(y-5)+'" width="6" height="10" rx="2" fill="#8a5a2e"/>';switch(kind){
 case 0:return '<path d="M'+(x-22)+' '+y+' H'+(x+22)+' L'+(x+36)+' '+(y+16)+' L'+(x+25)+' '+(y+25)+' L'+(x+21)+' '+(y+19)+' V'+(y+60)+' H'+(x-21)+' V'+(y+19)+' L'+(x-25)+' '+(y+25)+' L'+(x-36)+' '+(y+16)+'Z" fill="'+c+'"/>'+peg; // shirt
 case 1:return '<rect x="'+(x-19)+'" y="'+y+'" width="38" height="56" rx="3" fill="'+c+'"/><rect x="'+(x-19)+'" y="'+(y+40)+'" width="38" height="7" fill="#fff" opacity=".7"/>'+peg; // towel
 case 2:return '<path d="M'+(x-16)+' '+y+' H'+(x+16)+' L'+(x+22)+' '+(y+88)+' H'+(x-22)+'Z" fill="'+c+'"/><path d="M'+(x-16)+' '+y+' L'+(x-30)+' '+(y+14)+' L'+(x-20)+' '+(y+22)+' M'+(x+16)+' '+y+' L'+(x+30)+' '+(y+14)+' L'+(x+20)+' '+(y+22)+'" fill="'+c+'"/>'+peg; // thobe
 default:return '<path d="M'+(x-24)+' '+y+' H'+(x+24)+' L'+x+' '+(y+46)+'Z" fill="'+c+'"/>'+peg}} // scarf
/* A washing line from one point to another, sagging in the middle, with clothes pegged along it. */
function washing(x1,y1,x2,y2,sag,C){var cx=(x1+x2)/2,cy=(y1+y2)/2+sag*2,h='<path d="M'+x1+' '+y1+' Q'+cx+' '+cy+' '+x2+' '+y2+'" stroke="#6b5544" stroke-width="3" fill="none"/>';
 C.forEach(function(c,i){var t=(i+.5)/C.length,u=1-t,x=u*u*x1+2*u*t*cx+t*t*x2,y=u*u*y1+2*u*t*cy+t*t*y2;h+=ph(cloth(x,y,c,i%4),9+i%3*4,1+i%2*.5)});return h}
function datePalm(x,base,h,flip){var top=base-h,f=flip?-1:1;return '<path d="M'+x+' '+base+' Q'+(x+f*18)+' '+(base-h/2)+' '+(x+f*6)+' '+top+'" stroke="#8a5a2b" stroke-width="16" fill="none" stroke-linecap="round"/>'
 +ph([[-120,30],[-80,-40],[0,-60],[80,-40],[120,30],[-60,60],[60,60]].map(function(p,i){return '<path d="M'+(x+f*6)+' '+top+' Q'+(x+f*6+p[0]*.5)+' '+(top+p[1]-40)+' '+(x+f*6+p[0])+' '+(top+p[1]+20)+' Q'+(x+f*6+p[0]*.55)+' '+(top+p[1]-12)+' '+(x+f*6)+' '+top+'Z" fill="'+(i%2?"#2f9a4f":"#3db35e")+'"/>'}).join("")
  +'<circle cx="'+(x+f*6-10)+'" cy="'+(top+16)+'" r="9" fill="#e07a2c"/><circle cx="'+(x+f*6+8)+'" cy="'+(top+20)+'" r="9" fill="#c9611c"/>',7,.9,1)}
function cypress(x,base,h,c){return ph('<path d="M'+x+' '+(base-h)+' Q'+(x+26)+' '+(base-h*.45)+' '+(x+14)+' '+base+' H'+(x-14)+' Q'+(x-26)+' '+(base-h*.45)+' '+x+' '+(base-h)+'Z" fill="'+(c||"#2f6b3e")+'"/>',10,.5,1)}
function minaret(x,top,base,body,cap){return '<rect x="'+(x-9)+'" y="'+top+'" width="18" height="'+(base-top)+'" fill="'+body+'"/><rect x="'+(x-14)+'" y="'+(top+40)+'" width="28" height="7" rx="2" fill="'+cap+'"/><rect x="'+(x-13)+'" y="'+(top+(base-top)*.55)+'" width="26" height="6" rx="2" fill="'+cap+'"/>'
 +'<path d="M'+(x-9)+' '+top+' L'+x+' '+(top-34)+' L'+(x+9)+' '+top+'Z" fill="'+cap+'"/><path d="M'+x+' '+(top-34)+' V'+(top-46)+'" stroke="'+cap+'" stroke-width="3"/>'}
function arches(x,y,w,n,h,c){return rep(n,function(i){var a=x+i*w+w*.2,b=w*.6;return '<path d="M'+a+' '+(y+h)+' V'+(y+b/2)+' Q'+(a+b/2)+' '+(y-b*.3)+' '+(a+b)+' '+(y+b/2)+' V'+(y+h)+'Z" fill="'+c+'"/>'})}
function crescent(x,y,r,c,bg){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/><circle cx="'+(x+r*.38)+'" cy="'+(y-r*.18)+'" r="'+(r*.86)+'" fill="'+bg+'"/>'}
/* The time on Makkah's clock tower, so it shows the real time. */
function hands(cx,cy,r){var d=new Date(),m=d.getMinutes()*60+d.getSeconds(),h=(d.getHours()%12)*3600+m;
 return '<path class="hand" style="transform-origin:'+cx+'px '+cy+'px;animation-duration:43200s;animation-delay:-'+h+'s" d="M'+cx+' '+cy+' V'+(cy-r*.5)+'" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>'
  +'<path class="hand" style="transform-origin:'+cx+'px '+cy+'px;animation-duration:3600s;animation-delay:-'+m+'s" d="M'+cx+' '+cy+' V'+(cy-r*.78)+'" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>'}

/* ---------- The worlds ----------

   and what carries the Presenter's names through it (rider). Flat colours, no gradients. The horizon sits about a third of the
   way down so the landmark shows above the podium and the lists. */
var W={

   // The valley floor, then the open ground round the Kaaba with its edge.
   +'<rect y="372" width="1600" height="528" fill="#efe0c2"/><rect y="560" width="1600" height="340" fill="#e7d4b0"/><rect y="760" width="1600" height="140" fill="#dcc69c"/>'

   +'<ellipse cx="1240" cy="388" rx="150" ry="12" fill="rgba(80,55,20,.2)"/>'
   +'<path d="M1092 158 L1182 142 L1384 142 L1294 158Z" fill="#3b3b3b"/><rect x="1092" y="158" width="202" height="228" fill="#151515"/><path d="M1294 158 L1384 142 V370 L1294 386Z" fill="#292929"/>'
   +'<rect x="1092" y="202" width="202" height="16" fill="'+gold+'"/><path d="M1294 202 L1384 186 V202 L1294 218Z" fill="#b98a22"/>'
   +rep(9,function(i){return '<rect x="'+(1100+i*22)+'" y="207" width="12" height="6" rx="2" fill="#7a5a12"/>'})
   +'<rect x="1216" y="256" width="44" height="80" rx="3" fill="'+gold+'"/><rect x="1224" y="264" width="28" height="64" fill="#a8791b"/><path d="M1238 264 V328" stroke="'+gold+'" stroke-width="3"/>'
   +'<ellipse cx="1288" cy="350" rx="7" ry="10" fill="#3a3a3a" stroke="#c9c9c9" stroke-width="4"/>'
   // The well of Zamzam on the ground beside it, its bucket swinging on the rope.
   +'<ellipse cx="960" cy="432" rx="40" ry="11" fill="#a99a80"/><rect x="920" y="410" width="80" height="22" fill="#bdae92"/><ellipse cx="960" cy="410" rx="40" ry="11" fill="#cfc1a6"/><ellipse cx="960" cy="410" rx="29" ry="6" fill="#3c5f74"/>'

   +'<path d="M254 270 H276" stroke="#7a5230" stroke-width="8" stroke-linecap="round"/><circle cx="274" cy="270" r="5" fill="#6b5544"/>'
   +'<ellipse cx="640" cy="440" rx="16" ry="5" fill="rgba(80,55,20,.25)"/><path d="M640 440 V300" stroke="#7a5230" stroke-width="9" stroke-linecap="round"/><path d="M628 286 L640 304 L652 286" stroke="#7a5230" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="640" cy="302" r="5" fill="#6b5544"/>'

 madinah:{sky:"#8fd3f5",rider:"pigeon",
  html:function(){var wall="#f3ebda",green="#1f9254",cap="#d9a531";
   return bands([[26,"#a5dcf7"],[36,"#bfe6fa"]])+'<div class="sun" style="width:11vh;height:11vh;left:56vw;top:15vh"></div>'+clouds(5,[12,30])

 aqsa:{sky:"#87cbe9",rider:"bird",
  html:function(){var stone="#dcc195",gold="#f2b531";
   return bands([[28,"#9fd5ee"],[38,"#bde2f3"]])+'<div class="sun" style="width:12vh;height:12vh;left:60vw;top:14vh"></div>'+clouds(4,[12,28])
   +LAND+'<path d="M0 330 Q200 260 420 310 Q640 250 860 312 Q1080 262 1300 300 Q1460 270 1600 296 V900 H0Z" fill="#a0aa70"/><path d="M0 352 Q260 300 520 340 Q800 300 1060 338 Q1320 302 1600 334 V900 H0Z" fill="#8c9760"/>'

/* The house leaderboard: a step for each house, highest in the middle, with its logo, rank and points. Houses on the
   same points share a rank and a height. */
function houseBoard(H,unit){H=H.slice().sort(function(a,b){return b.n-a.n});
 H.forEach(function(h){h.rank=1+H.filter(function(o){return o.n>h.n}).length});
 var at=[1,0,2];return '<div class="podium hp">'+at.map(function(i){var h=H[i];if(!h)return '<div class="col"></div>';var p=Math.min(h.rank,3);
  return '<div class="col p'+p+'"><div class="who">'+(h.rank===1&&h.n?CROWN:'')+'<div class="pc '+esc(h.house)+'">'+logo(h.house)+'<span class="pn">'+esc(h.house)+'</span></div></div>'
   +'<div class="step"><b>'+ord(h.rank)+'</b><span>'+plural(h.n,unit)+'</span></div></div>'}).join("")+'</div>'}
function schoolHouses(){return data.houses.map(function(h){return {house:h.house,n:h.points}})}
function classHouses(){var n={};(data.houses||[]).forEach(function(s){s.who.forEach(function(w){n[w.house]=s.n})});
 return ["Makkah","Al-Aqsa","Madinah"].map(function(h){return {house:h,n:n[h]||0}})}
/* The podium sits below the title and above the base, so names on a step (ties included) shrink to fit the space
   over it instead of rising behind the title. */
function fitPodium(el){var z=1,W=[];[].forEach.call(el.querySelectorAll(".podium .col"),function(c){var w=c.querySelector(".who"),st=c.querySelector(".step");if(!w||!st)return;
 var room=c.clientHeight-parseFloat(getComputedStyle(c).paddingTop)-st.offsetHeight-parseFloat(getComputedStyle(w).marginBottom),h=w.offsetHeight;W.push(w);
 if(h>room&&room>0)z=Math.min(z,room/h)});
 // One size for every step, so first place never looks smaller than the others.
 if(z<1)W.forEach(function(w){w.style.zoom=Math.max(.5,z).toFixed(3)})}
function fitNames(el){[].forEach.call(el.querySelectorAll(".pc.cls .pn"),function(n){var f=parseFloat(getComputedStyle(n).fontSize)/innerHeight*100;
 while(f>2.4&&n.scrollWidth>n.clientWidth+1){f-=.2;n.style.fontSize=f+"vh"}})}
/* id, world, which window it belongs to, title, subtitle, and what it shows. */
var SLIDES=[
 {id:"qaidah",world:"madinah",kind:"qaidah",title:"Qaidah level and book passes",sub:function(){return "Most Qaidah levels passed in "+month()+", and every book finished"},ranks:qaidahBands,empty:"No Qaidah level or book passes yet this month."},
 {id:"memo-primary",world:"aqsa",kind:"memo",title:"Top Class for Memorisation",stage:"(Primary Years)",sub:function(){return "Years 2 to 6, in "+month()},steps:function(){return data.classes.memo.primary},unit:"pass",empty:"No primary memorisation passes yet."},
 {id:"memo-secondary",world:"makkah",kind:"memo",title:"Top Class for Memorisation",stage:"(Secondary Years)",sub:function(){return "Years 7 to 10, in "+month()},steps:function(){return data.classes.memo.secondary},unit:"pass",empty:"No secondary memorisation passes yet."},
 {id:"houses",world:"festival",kind:"all",title:"House points",sub:function(){return "The house leaderboard"},board:schoolHouses,unit:"point"}];
/* A class's Presenter: this month's tops in the class. */
var PSLIDES=[
 {id:"quran",world:"makkah",kind:"all",title:"Quran",sub:function(){return "Best average score in "+month()},steps:function(){return data.quran},fmt:function(n){return n.toFixed(1)+" average"},empty:"Not enough Quran scores yet this month."},
 {id:"memo",world:"hira",kind:"all",title:"Memorisation and book passes",sub:function(){return "Most memorisation passes in "+month()+", and every book finished"},ranks:memoBands,empty:"No memorisation or book passes yet this month."},
 {id:"qaidah",world:"madinah",kind:"all",title:"Qaidah level passes",sub:function(){return "Most levels passed in "+month()},steps:function(){return data.qaidah},unit:"level",empty:"No Qaidah levels passed yet this month."},
 {id:"points",world:"aqsa",kind:"all",title:"House points",sub:function(){return "Most points earned in "+month()},steps:function(){return data.points},unit:"point",empty:"No house points earned yet this month."},
 {id:"houses",world:"festival",kind:"all",title:"House race",sub:function(){return "Points this class earned for each house in "+month()},board:classHouses,unit:"point"},
 {id:"merits",world:"thawr",kind:"all",title:"Merits",sub:function(){return "Most merits in "+month()},steps:function(){return data.merits},unit:"merit",empty:"No merits yet this month."},
 {id:"stars",world:"moon",kind:"all",title:"Stars of the week",sub:function(){return month()+", up to the end of last week"},list:function(){return data.stars},empty:"No stars of the week yet this month.",week:1,one:1}];
if(PRESENT)SLIDES=PSLIDES;
function focusNow(){if(FOCUS==="qaidah"||FOCUS==="memo")return [FOCUS];return data&&data.focus}
function playing(){if(PIN){var p=SLIDES.filter(function(s){return s.id===PIN});if(p.length)return p}
 var f=focusNow(),L=SLIDES.filter(function(s){return !f||f.indexOf(s.kind)>=0});
 var full=L.filter(function(s){return (s.steps?s.steps():s.ranks?s.ranks():s.board?s.board():s.list()).length});return full.length?full:L}
function build(s){s.w=typeof s.world==="string"?s.world:s.world[(s.turn=(s.turn||0)+1)%s.world.length];var w=W[s.w],el=document.createElement("section");el.className="slide";el.style.background=w.sky;
 var body=s.steps?podium(s.steps(),s.unit,s.empty,s.fmt):s.ranks?ranks(s.ranks(),s.empty):s.board?houseBoard(s.board(),s.unit):'<div class="cycle"></div>';
 el.innerHTML='<div class="scene">'+w.html()+'</div><div class="carriers"></div><div class="content"><div class="title"><h2>'+esc(s.title)+'<span class="pg"></span></h2>'+(s.stage?'<span class="stage">'+esc(s.stage)+'</span>':'')+'<p>'+esc(s.sub())+'</p></div>'+body+'</div>';
 return el}
/* A list takes turns a page at a time so everyone is seen within the slide's 30 seconds:
   up to six pages, each at least five seconds, as many names on a page as that needs.
   Stars of the week are all on one page (one per class), as big as fits. */
function cycle(el,s){var L=s.list(),box=el.querySelector(".cycle");if(!L.length){box.innerHTML='<div class="empty">'+esc(s.empty)+'<small>Keep going!</small></div>';return}
 var pages=s.one?1:Math.min(L.length,6),per=Math.ceil(L.length/pages),i=0,pg=el.querySelector(".pg");pages=Math.ceil(L.length/per);
 var cols=per===4?2:per<=3?per:per<=9?3:per<=16?4:per<=20?5:6,size=per===1?12:per<=2?8.4:per<=4?7:per<=6?6.4:per<=9?5.8:per<=16?5.2:4;
 function draw(){var P=L.slice(i*per,i*per+per),g=document.createElement("div");g.className="names"+(per===1?" solo":"");
  g.style.gridTemplateColumns=per===1?"minmax(0,64vw)":"repeat("+Math.min(cols,P.length)+",minmax(0,"+(per<=2?40:per===4?38:per<=9?28:Math.floor(88/cols))+"vw))";g.style.fontSize=size+"vh";
  g.innerHTML=P.map(function(w,k){return '<div class="nc '+esc(w.house||"")+'" style="animation-delay:'+(.15+k*.08)+'s"><span class="pn">'+esc(w.name)+'</span>'+(w.class?'<span class="pcl">'+esc(w.class)+'</span>':'')+''+(s.week?'<span class="wk">'+esc(w.label)+'</span>':'')+'</div>'}).join("");
  var old=box.querySelector(".names:not(.leave)");if(old){old.classList.add("leave");setTimeout(function(){old.remove()},650)}
  box.appendChild(g);var f=size;while(f>2.4&&g.scrollHeight>box.clientHeight+2){f-=.2;g.style.fontSize=f+"vh"}
  pg.textContent=pages>1?(i+1)+" of "+pages:""}
 draw();if(pages>1)PT=setInterval(function(){i=(i+1)%pages;draw()},SLIDE_MS/pages)}
function confetti(el){if(RM)return;var c=el.querySelector(".p1 .step");if(!c)return;var r=c.getBoundingClientRect(),C=["#ffd23f","#ff5d73","#4fc3ff","#7ee06a","#c77dff","#fff"];
 for(var i=0;i<46;i++){var p=document.createElement("i");p.className="confetti";p.style.background=pick(C);p.style.left=(r.left+r.width/2)+"px";p.style.top=(r.top)+"px";el.appendChild(p);
  var dx=rnd(-30,30),dy=rnd(-55,-25);var a=p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+dx+"vw,"+dy+"vh) rotate("+rnd(200,700)+"deg)",opacity:1,offset:.45},{transform:"translate("+dx*1.3+"vw,"+(dy+60)+"vh) rotate("+rnd(700,1200)+"deg)",opacity:0}],{duration:rnd(2600,3800),delay:1200,easing:"cubic-bezier(.2,.6,.4,1)",fill:"both"});
  a.onfinish=(function(p){return function(){p.remove()}})(p)}}
function show(){if(!data)return;clearTimeout(ST);clearInterval(PT);clearInterval(RT);
 var L=playing(),k=0;for(var j=0;j<L.length;j++)if(L[j].id===curId){k=(j+1)%L.length;break}
 var s=L[k],el=build(s),old=cur;curId=s.id;cur=el;$("stage").appendChild(el);
 $("dots").innerHTML=L.map(function(x,j){return '<i'+(j===k?' class="on"':'')+'></i>'}).join("");
 var f=focusNow();$("mode").textContent=f&&!PIN?(f.length>1?"Qaidah and Memo time":f[0]==="qaidah"?"Qaidah time":"Memo time"):"";
 void el.offsetWidth;el.classList.add("on");
 if(old){old.classList.add("out");setTimeout(function(){old.remove()},1500)}
 if(s.list)cycle(el,s);else{confetti(el);fitNames(el);fitPodium(el);fitRanks(el)}
 physOn(el);
 if(s.board)PT=setInterval(function(){confetti(el)},9000); // the house leaderboard keeps celebrating
 // Only the Presenter has riders, carrying the class's names; the TV's scenes move on their own.
 if(PRESENT){var box=el.querySelector(".carriers"),kind=W[s.w].rider;setTimeout(function(){ride(box,kind)},1800);RT=setInterval(function(){ride(box,kind)},7000)}
 var p=$("prog");p.className="";p.style.transitionDuration="0ms";void p.offsetWidth;p.style.transitionDuration=SLIDE_MS+"ms";p.className="run";
 ST=setTimeout(show,SLIDE_MS)}
function load(){fetch(URL,{credentials:"same-origin",cache:"no-store"}).then(function(r){
  if(r.status===404||r.status===401){$("off").style.display="flex";$("off").textContent=r.status===401?"Sign in to see the dashboard.":PRESENT?"This class isn't one of yours, or it has been deleted.":"This screen's link has been turned off. Ask an administrator for a new one.";return null}
  return r.ok?r.json():null}).then(function(d){if(d){var first=!data;data=d;$("off").style.display="none";
   if(PRESENT){$("brand").innerHTML=esc(d.class)+"<small>Safar Academy</small>";document.title=d.class+" · Presenter"}if(first)show()}}).catch(function(){/* keep showing the last data */})}
clock();setInterval(clock,1000);load();setInterval(load,DATA_MS);
/* The full-screen icon shows while the mouse moves, on a TV and in the Presenter. The Presenter runs on a teacher's
   screen, so it also has Close; Escape also closes. */
(function(){var C=$("ctl"),CT=0,F=$("fs");C.hidden=false;
 function wake(){C.classList.add("on");clearTimeout(CT);CT=setTimeout(function(){C.classList.remove("on")},2500)}
 document.addEventListener("mousemove",wake);document.addEventListener("touchstart",wake,{passive:true});if(PRESENT)wake();

 F.onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()};
 document.addEventListener("fullscreenchange",function(){var on=!!document.fullscreenElement,t=on?"Exit full screen":"Full screen";F.classList.toggle("full",on);F.setAttribute("aria-label",t);F.title=t});
 if(!PRESENT)return;
 function close(){location.href="/"+(data&&data.id?"#"+data.id:"")} // back to the class on the dashboard
 $("close").hidden=false;$("close").onclick=close;document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!document.fullscreenElement)close()})})();

setInterval(function(){fetch(location.href,{cache:"no-store"}).then(function(r){if(r.ok)location.reload()}).catch(function(){})},6*3600*1000);
})();
