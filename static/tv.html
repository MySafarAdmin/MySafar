<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Safar Academy · Live</title>
<style>
@font-face{font-family:"Atkinson Next";src:url(/fonts/atkinson-next-latin.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* Student-facing display: Safar navy, house colours and real celebration for real achievements. */
:root{--bg:#002848;--bg2:#003b6b;--panel:#04345d;--line:#1d4f7c;--text:#fff;--mute:#a9c3dd;--gold:#f5c542;--silver:#d7e0ea;--bronze:#e39a5b;
 --makkah:#f2b632;--aqsa:#4bb3f5;--madinah:#3ccf91;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,var(--bg2),var(--bg) 60%);color:var(--text);font-family:"Atkinson Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{display:flex;flex-direction:column;padding:2.4vh 2.6vw;gap:2.2vh}
header{display:flex;align-items:center;gap:1.6vw}
header .badge{flex:none;width:9vh;height:9vh;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 .5vh rgba(255,255,255,.18)}
header img{width:7.8vh;height:7.8vh}
header h1{font-size:4.6vh;margin:0;flex:1;font-weight:800;letter-spacing:-.01em;line-height:1.05}
header h1 small{display:block;font-size:2.4vh;font-weight:600;color:var(--mute);letter-spacing:0}
header .clock{font-size:5.4vh;font-weight:800}
.dots{display:flex;gap:1vh}.dots i{width:1.6vh;height:1.6vh;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
main{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:grid;gap:2vh 2vw;opacity:0;transition:opacity .8s;pointer-events:none}
.slide.on{opacity:1}
#s1{grid-template-columns:1.1fr 1fr}#s2{grid-template-columns:1.6fr 1fr}
.panel{background:rgba(4,52,93,.82);border:.25vh solid var(--line);border-radius:2.6vh;padding:2.8vh 2.2vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h2{margin:0 0 2.2vh;font-size:4.4vh;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.panel h2 small{display:block;font-size:2.5vh;color:var(--mute);font-weight:600;letter-spacing:0;margin-top:.6vh}
.fit{flex:1;min-height:0;overflow:hidden}
/* Houses as columns: the height is the points, the leader (only when strictly ahead) is crowned in gold. */
.houses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw;height:100%}
.house{display:grid;grid-template-rows:5vh 11vh minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;text-align:center}
.house em{grid-row:1;font-style:normal;font-size:2.6vh;font-weight:800;color:#2b1d00;background:var(--gold);border-radius:99px;padding:.4vh 1.6vh;justify-self:center;align-self:start}
.house .pts{grid-row:2;align-self:end;font-size:7.4vh;font-weight:800;line-height:1;margin-bottom:1.2vh}
.house.lead .pts{font-size:9.6vh;color:var(--gold)}
.house .track{grid-row:3;display:flex;align-items:flex-end;min-height:0}
.house .track i{display:block;width:100%;border-radius:2vh 2vh .6vh .6vh;min-height:1vh}
.house .hn{grid-row:4;font-size:4.6vh;font-weight:800;white-space:nowrap;margin-top:1.4vh;line-height:1.1}
.Makkah .hn{color:var(--makkah)}.Makkah .track i{background:var(--makkah)}
.Al-Aqsa .hn{color:var(--aqsa)}.Al-Aqsa .track i{background:var(--aqsa)}
.Madinah .hn{color:var(--madinah)}.Madinah .track i{background:var(--madinah)}
.stages{display:grid;grid-template-rows:1fr 1fr;gap:2vh}
.stage h3{margin:0 0 .8vh;font-size:3vh;color:var(--gold);font-weight:800}
.podium{display:flex;flex-direction:column;gap:1vh}
.pod{display:grid;grid-template-columns:6vh 1fr auto;align-items:center;gap:1.2vw;font-size:3.3vh;font-weight:800;background:rgba(255,255,255,.06);border-radius:1.6vh;padding:.6vh 1.2vw;line-height:1.15}
.pod .m{width:5.2vh;height:5.2vh;border-radius:50%;display:grid;place-items:center;font-size:3.2vh;font-weight:800;color:#24170a;background:var(--gold);box-shadow:0 0 0 .4vh rgba(245,197,66,.25)}
.pod .m.r2{background:var(--silver);box-shadow:0 0 0 .4vh rgba(215,224,234,.2)}.pod .m.r3{background:var(--bronze);box-shadow:0 0 0 .4vh rgba(227,154,91,.22)}
.pod .c{display:block;font-size:2.1vh;color:var(--mute);font-weight:600}
.pod .n{color:var(--gold);font-weight:800}
/* First place (every student who shares it) is the moment to celebrate. */
.pod.top{font-size:4.1vh;padding:.8vh 1.2vw;background:rgba(245,197,66,.16);box-shadow:inset 0 0 0 .3vh rgba(245,197,66,.55)}
.pod.top .m{width:5.8vh;height:5.8vh;font-size:3.5vh}
.pod.top .c{font-size:2.2vh}
.stars{display:grid;gap:1.4vh 1vw;height:100%;align-content:start}
.star{background:rgba(255,255,255,.06);border-radius:1.6vh;padding:1em .9em;border-left:.5vh solid var(--gold);min-width:0}
.star .c{font-size:.62em;color:var(--mute);font-weight:700;overflow-wrap:anywhere}
.star .n{font-size:1.1em;font-weight:800;overflow-wrap:anywhere;line-height:1.15}
.star .w{font-size:.62em;color:var(--gold);font-weight:700}
.bookhead{display:flex;align-items:baseline;gap:1.2vw;margin:-.6vh 0 1.6vh}
.bookhead b{font-size:9vh;font-weight:800;color:var(--gold);line-height:1}
.bookhead span{font-size:2.8vh;font-weight:700;color:var(--mute)}
.books.many .book small{display:none}
.star.none{border-left-color:var(--line)}.star.none .n{color:var(--mute);font-weight:700;white-space:normal;font-size:.9em}
.books{display:grid;column-gap:2vw;align-content:start}
/* A list too long for the screen at a readable size is shown a page at a time. */
.pgn{float:right;font-size:2.4vh;font-weight:700;color:var(--gold);margin-top:1vh}
.pgn:empty{display:none}
.book{break-inside:avoid;padding:.35em 0;border-bottom:.2vh solid var(--line);font-weight:800}
.book small{display:block;font-size:.6em;color:var(--mute);font-weight:600}
.empty{color:var(--mute);font-size:3.2vh;font-weight:700}
footer{height:.8vh;background:var(--line);border-radius:1vh;overflow:hidden}
footer i{display:block;height:100%;width:0;background:var(--gold)}
footer i.run{width:100%;transition:width linear}
#off{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--bg);font-size:4vh;font-weight:800;padding:5vw}
@media (prefers-reduced-motion:reduce){.slide{transition:none}footer i.run{transition:none}}
</style>
</head>
<body>
<header><span class="badge"><img src="/logo.png" alt="" width="80" height="80"></span><h1 id="title">Safar Academy<small>Enfield</small></h1><div class="dots"><i class="on"></i><i></i></div><div class="clock" id="clock"></div></header>
<main>
  <section class="slide on" id="s1">
    <div class="panel"><h2>House points<small>Who's leading the school</small></h2><div class="fit"><div class="houses" id="houses"></div></div></div>
    <div class="panel"><h2>Memorisation<small>Most passes in <span class="month"></span></small></h2><div class="fit stages">
      <div class="stage"><h3>Primary</h3><div class="podium" id="primary"></div></div>
      <div class="stage"><h3>Secondary</h3><div class="podium" id="secondary"></div></div>
    </div></div>
  </section>
  <section class="slide" id="s2">
    <div class="panel"><h2>Star of the week<span class="pgn" id="starsPg"></span><small>Most passes and merits since Monday, in each class</small></h2><div class="fit" id="starsFit"><div class="stars" id="stars"></div></div></div>
    <div class="panel"><h2>Passed a book<span class="pgn" id="booksPg"></span><small>Well done, all of <span class="month"></span></small></h2><div class="bookhead" id="bookhead"></div><div class="fit" id="booksFit"><div class="books" id="books"></div></div></div>
  </section>
</main>
<footer><i id="prog"></i></footer>
<div id="off"></div>
<script>
(function(){
var SLIDE_MS=30000,DATA_MS=60000,PAGE_MS=10000;
var path=location.pathname.replace(/\/+$/,""),URL=path==="/tv"?"/api/tv":path+"/data";
var slide=0,data=null;
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function $(id){return document.getElementById(id)}
function clock(){var d=new Date();$("clock").textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
/* Shrinks the text in a box until it fits, down to a size still readable across a room.
   A list that still does not fit is split into pages that take turns (see pages()). */
function fit(box,inner,start,min){var size=start;inner.style.fontSize=size+"vh";
 while(size>min&&inner.scrollHeight>box.clientHeight+2){size-=.2;inner.style.fontSize=size+"vh"}}
var PG={},PI={};
function pages(key,box,inner,items,start,min){inner.innerHTML=items.join("");fit(box,inner,start,min);var P=[],cur=[];
 if(inner.scrollHeight>box.clientHeight+2){inner.innerHTML="";items.forEach(function(h){inner.insertAdjacentHTML("beforeend",h);
  if(inner.scrollHeight>box.clientHeight+2&&cur.length){P.push(cur);cur=[];inner.innerHTML=h}cur.push(h)});if(cur.length)P.push(cur)}
 else P=[items];
 PG[key]=P;PI[key]=(PI[key]||0)%P.length;page(key)}
function page(key){var P=PG[key],i=PI[key];$(key).innerHTML=P[i].join("");$(key+"Pg").textContent=P.length>1?"Page "+(i+1)+" of "+P.length:""}
function turn(){["stars","books"].forEach(function(k){if(PG[k]&&PG[k].length>1){PI[k]=(PI[k]+1)%PG[k].length;page(k)}})}
function render(){if(!data)return;
 Array.prototype.forEach.call(document.querySelectorAll(".month"),function(e){e.textContent=data.month});
 var top=Math.max(1,data.houses[0].points);
 $("houses").innerHTML=data.houses.map(function(h,i){var lead=i===0&&h.points>(data.houses[1]||{}).points;return '<div class="house '+esc(h.house)+(lead?' lead':'')+'">'+(lead?'<em>Leading</em>':'')+'<div class="pts">'+h.points+'</div><div class="track"><i style="height:'+Math.max(2,h.points/top*100)+'%"></i></div><div class="hn">'+esc(h.house)+'</div></div>'}).join("");
 ["primary","secondary"].forEach(function(k){var L=data.passes[k];
  $(k).innerHTML=L.length?L.map(function(p,i){var r=1;while(r-1<i&&L[r-1].passes!==p.passes)r++;return '<div class="pod'+(r===1?' top':'')+'"><span class="m r'+r+'"'+(r<=i?' title="Joint '+r+'"':'')+'>'+r+'</span><span>'+esc(p.name)+'<span class="c">'+esc(p.class)+'</span></span><span class="n">'+p.passes+'</span></div>'}).join(""):'<div class="empty">No passes yet this month. Who will be first?</div>'});
 var S=data.stars,cols=S.length>16?4:S.length>6?3:S.length>2?2:1;
 $("stars").style.gridTemplateColumns="repeat("+cols+",minmax(0,1fr))";
 var SI=S.length?S.map(function(s){return s.name?'<div class="star"><div class="c">'+esc(s.class)+'</div><div class="n">'+esc(s.name)+'</div><div class="w">'+s.passes+(s.passes===1?" pass":" passes")+', '+s.merits+(s.merits===1?" merit":" merits")+'</div></div>':'<div class="star none"><div class="c">'+esc(s.class)+'</div><div class="n">Could it be you?</div></div>'}):['<div class="empty">No classes yet.</div>'];
 var B=data.books;$("books").style.gridTemplateColumns="repeat("+(B.length>24?3:B.length>8?2:1)+",minmax(0,1fr))";$("books").classList.toggle("many",B.length>16);
 $("bookhead").innerHTML=B.length?'<b>'+B.length+'</b><span>'+(B.length===1?"student":"students")+'</span>':"";
 var BI=B.length?B.map(function(b){return '<div class="book">'+esc(b.name)+'<small>'+esc(b.class)+'</small></div>'}):['<div class="empty">No books completed yet this month. Keep going!</div>'];
 pages("stars",$("starsFit"),$("stars"),SI,cols>2?3.4:4.4,2.6);pages("books",$("booksFit"),$("books"),BI,4.2,2.8)}
/* Each slide stays long enough for every page of its lists to be seen once. */
var ST=null,PT=null;
function show(n){slide=n;clearTimeout(ST);clearInterval(PT);["s1","s2"].forEach(function(id,i){$(id).classList.toggle("on",i===n)});
 Array.prototype.forEach.call(document.querySelectorAll(".dots i"),function(d,i){d.classList.toggle("on",i===n)});
 var p=$("prog");p.className="";p.style.transitionDuration="0ms";void p.offsetWidth;render();var ms=n===1?Math.max(SLIDE_MS,PAGE_MS*Math.max((PG.stars||[]).length,(PG.books||[]).length)):SLIDE_MS;
 p.style.transitionDuration=ms+"ms";p.className="run";if(n===1)PT=setInterval(turn,PAGE_MS);ST=setTimeout(function(){show(1-slide)},ms)}
function load(){fetch(URL,{credentials:"same-origin",cache:"no-store"}).then(function(r){
  if(r.status===404||r.status===401){$("off").style.display="flex";$("off").textContent=r.status===404?"This screen's link has been turned off. Ask an administrator for a new one.":"Sign in to see the dashboard.";return null}
  return r.ok?r.json():null}).then(function(d){if(d){data=d;$("off").style.display="none";render()}}).catch(function(){/* keep showing the last data */})}
clock();setInterval(clock,1000);load();setInterval(load,DATA_MS);show(0);
/* Pick up new versions of this page, unless the network is down. */
setInterval(function(){fetch(location.href,{cache:"no-store"}).then(function(r){if(r.ok)location.reload()}).catch(function(){})},6*3600*1000);
window.addEventListener("resize",render);
})();
</script>
</body>
</html>
