<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>Safar Academy · Live</title>
<style>
@font-face{font-family:"Atkinson Next";src:url(/fonts/atkinson-next-latin.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* The school's celebration TV. Everything is laid out on a 1920 x 1080 stage that is scaled to fill the screen,
   so 1080p and 4K TVs show exactly the same picture, inside safe margins. Safar navy with warm stage lighting;
   the house colours are the ones the dashboard uses (src/tokens.css). Names and scores never move while
   someone could be reading them: only the background, the characters and scene changes do. */
:root{--navy:#003b6b;--deep:#001f3d;--ink:#0b2a4a;--cream:#fff8ec;--gold:#f5c542;--gold2:#e9a21a;--text:#fff;--mute:#bcd2ea;
 --makkah:#c9930c;--aqsa:#2386d1;--madinah:#1c9a68;--r1:#f2c14e;--r2:#b8c7d9;--r3:#d98b4f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);color:var(--text);
 font-family:"Atkinson Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
/* Background: navy sky, warm glow from below, drifting bubbles and twinkling stars. Transforms and opacity only. */
#sky{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:
 radial-gradient(60% 55% at 50% 108%,rgba(255,184,77,.42),rgba(255,184,77,0) 70%),
 radial-gradient(45% 45% at 8% 0%,rgba(122,108,230,.30),rgba(122,108,230,0) 70%),
 radial-gradient(40% 40% at 95% 10%,rgba(60,190,200,.22),rgba(60,190,200,0) 70%),
 linear-gradient(180deg,#00335e 0%,#002a50 55%,#001f3d 100%)}
#sky .glow{position:absolute;left:20%;right:20%;bottom:-30%;height:70%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,110,.32),rgba(255,200,110,0));animation:glow 9s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.65;transform:scale(1)}to{opacity:1;transform:scale(1.08)}}
.bub{position:absolute;bottom:-12vh;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.7),rgba(255,255,255,.12) 30%,var(--t) 64%,rgba(255,255,255,.22) 73%,rgba(255,255,255,0) 75%);animation:rise linear infinite;will-change:transform}
@keyframes rise{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(var(--sway),-62vh,0)}100%{transform:translate3d(0,-125vh,0)}}
.twk{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(255,236,170,.8);animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;padding:44px 80px 40px}
header{position:relative;height:118px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:32px}
.brand{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:20px}
.badge{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28),0 0 0 7px rgba(255,255,255,.16)}
.badge img{width:88px;height:88px}
.brand b{display:block;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.01em}
.brand small{display:block;font-size:26px;font-weight:700;color:var(--mute);margin-top:6px}
.title{text-align:center;transition:opacity .5s}
.title h1{margin:0;font-size:64px;font-weight:800;line-height:1;letter-spacing:-.015em;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.title h1 em{font-style:normal;display:inline-block;vertical-align:.12em;margin-left:18px;font-size:34px;padding:8px 22px;border-radius:99px;background:var(--gold);color:var(--ink)}
.title p{margin:10px 0 0;font-size:30px;font-weight:700;color:var(--mute)}
.clock{font-size:58px;font-weight:800;padding:14px 30px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 10px 24px rgba(0,0,0,.2)}
main{position:absolute;left:80px;right:80px;top:172px;bottom:96px;z-index:0}
.scene{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity .7s ease,transform .7s ease;transform:scale(.985);pointer-events:none}
.scene.on{opacity:1;transform:none}
footer{position:absolute;left:80px;right:80px;bottom:34px;height:40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.dots{grid-column:2;display:grid;grid-auto-flow:column;column-gap:14px}
.dots i{width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.22);transition:width .5s,background .5s}
.dots i.on{width:54px;background:var(--gold)}
.pg{grid-column:3;justify-self:end;font-size:28px;font-weight:800;color:var(--gold)}
.bar{position:absolute;left:0;right:0;bottom:-14px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px}

/* Podium. Columns sit in fixed slots: second on the left, first in the middle, third on the right. A house keeps
   its name, colour, landmark and score together when it changes place. */
.pod{position:absolute;left:0;right:0;bottom:0;top:0}
.floor{position:absolute;left:180px;right:180px;bottom:-26px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.38),rgba(255,214,140,0))}
.col{position:absolute;bottom:0;width:420px;margin-left:-210px;display:grid;justify-items:center;transition:left 1.4s cubic-bezier(.6,0,.25,1)}
.col .over{display:grid;justify-items:center;row-gap:12px;margin-bottom:46px}
.plat{position:relative;width:400px;height:0;border-radius:34px 34px 14px 14px;transition:height 1.2s cubic-bezier(.3,1.35,.45,1);
 background:linear-gradient(180deg,var(--c2) 0,var(--c) 34px,var(--c) 70%,var(--c3) 100%);
 box-shadow:inset 0 4px 0 rgba(255,255,255,.45),inset 0 -10px 0 rgba(0,0,0,.14),0 22px 40px rgba(0,0,0,.32)}
.plat .face{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;border-radius:inherit;display:grid;align-content:center;justify-items:center}
.medal{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;font-size:30px;font-weight:800;padding:8px 24px;border-radius:99px;color:var(--ink);background:var(--mc,#fff);box-shadow:0 6px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.6);z-index:2}
.pts{display:inline-block;font-size:104px;font-weight:800;line-height:1;padding:10px 34px 14px;border-radius:40px;background:var(--cream);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.14),inset 0 -4px 0 rgba(0,0,0,.06)}
.pts small{font-size:30px;font-weight:800;margin-left:8px;color:#56708c}
.hname{font-size:52px;font-weight:800;line-height:1;padding:12px 34px 14px;border-radius:99px;background:var(--c);color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 8px 18px rgba(0,0,0,.25);white-space:nowrap}
.Makkah{--c:var(--makkah);--c2:#f1c75a;--c3:#a67606}.Makkah .hname{color:var(--ink)}
.Al-Aqsa{--c:var(--aqsa);--c2:#7cc0f2;--c3:#1767a6}
.Madinah{--c:var(--madinah);--c2:#6fd3a5;--c3:#137450}
.land{width:250px;height:200px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3))}
.land svg{width:100%;height:100%;display:block}
.crown{width:150px;height:96px;margin-bottom:-10px;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3));transition:opacity .6s}
.crown.off{opacity:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.zero{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;font-size:40px;font-weight:800;padding:16px 40px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}
.zero b{color:var(--gold)}
/* Pupil podiums (memorisation champions): gold, silver and bronze platforms, the names above. */
.champ .col{width:440px;margin-left:-220px}
.champ .plat{width:420px}
.r1{--c:var(--r1);--c2:#ffe199;--c3:#c9962a;--mc:#ffe7a6}.r2{--c:var(--r2);--c2:#e3ebf4;--c3:#8ea2ba;--mc:#eef3f8}.r3{--c:var(--r3);--c2:#f2b98c;--c3:#a9612e;--mc:#f7cfae}
.names{display:grid;width:440px}
.pair{grid-area:1/1;display:grid;row-gap:12px;align-content:end;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.pair.on{opacity:1;transform:none}
.who{width:100%;text-align:center;padding:14px 22px 16px;border-radius:30px;background:var(--cream);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.14),0 16px 30px rgba(0,0,0,.22)}
.who b{display:block;font-size:48px;font-weight:800;line-height:1.08;white-space:nowrap}
.who span{display:block;font-size:28px;font-weight:700;color:#4a6481;margin-top:4px;white-space:nowrap}
.who span i{display:inline-block;width:20px;height:20px;border-radius:50%;margin-right:10px;vertical-align:-1px;background:var(--hc,#9fb3c8)}
.more{font-size:30px;font-weight:800;color:var(--gold)}
.champ .pts{font-size:96px}
/* Characters. Each one is anchored at its feet; the poses are separate images that take turns. */
.kid{position:absolute;bottom:0;width:0;height:0}
.kb{position:absolute;left:0;bottom:0;width:0;height:0;transform-origin:0 0}
.kp{position:absolute;left:0;bottom:0;width:0;height:0;animation:breathe 3.4s ease-in-out infinite;transform-origin:0 0}
.kid.b .kp{animation-delay:-1.7s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
.kp img{position:absolute;bottom:0;max-width:none;visibility:hidden;filter:drop-shadow(0 14px 14px rgba(0,0,0,.25))}
.kp img.on{visibility:visible}
.kp img.fl{transform:scaleX(-1)}
.shadow{position:absolute;left:-90px;width:180px;bottom:-14px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.32),rgba(0,0,0,0))}
.noart .kid{display:none}
/* Cards: stars of the week and book completions, a small group of classes or pupils per page. */
.cards{position:absolute;left:0;right:0;bottom:0;display:grid;column-gap:40px;row-gap:40px}
.card{position:relative;min-width:0;border-radius:44px;background:var(--cream);color:var(--ink);text-align:center;display:grid;align-content:center;justify-items:center;padding:30px 30px 34px;overflow:hidden;
 box-shadow:0 12px 0 rgba(0,0,0,.14),0 26px 44px rgba(0,0,0,.28),inset 0 -6px 0 rgba(0,0,0,.05);border-top:18px solid var(--c,var(--gold))}
.card .cls{font-size:30px;font-weight:800;padding:8px 24px;border-radius:99px;background:var(--navy);color:#fff;white-space:nowrap}
.card .nm{font-size:66px;font-weight:800;line-height:1.05;margin:18px 0 10px;white-space:nowrap;max-width:100%}
.card .why{font-size:30px;font-weight:700;color:#4a6481}
.card .why b{color:var(--ink)}
.card .ic{position:absolute;width:104px;height:104px;right:26px;top:22px;animation:wob 5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}
.card.none{background:rgba(255,255,255,.08);color:#fff;border:4px dashed rgba(255,255,255,.3);border-top:4px dashed rgba(255,255,255,.3);box-shadow:none}
.card.none .cls{background:rgba(255,255,255,.18)}
.card.none .nm{font-size:50px;color:#fff}
.card.none .why{color:var(--mute)}
.book .bk{width:110px;height:84px;margin-bottom:6px}
.book .nm{font-size:56px;margin:8px 0 6px}
.bookhead{position:absolute;left:0;right:0;top:0;text-align:center;font-size:44px;font-weight:800}
.bookhead b{display:inline-block;font-size:76px;line-height:1;padding:6px 30px 10px;margin-right:18px;border-radius:99px;background:var(--gold);color:var(--ink);vertical-align:-6px}
/* Encouragement when there is nothing yet: the characters and a friendly line. */
.empty{position:absolute;left:0;right:0;top:40px;text-align:center}
.empty h2{margin:0;font-size:76px;font-weight:800;line-height:1.05}
.empty p{margin:18px 0 0;font-size:40px;font-weight:700;color:var(--mute)}
/* Celebration stage: the heading, the name and the characters, with UI stars and confetti around them. */
#party{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s;border-radius:0;
 background:radial-gradient(70% 60% at 50% 100%,rgba(255,196,96,.45),rgba(255,196,96,0) 70%),radial-gradient(80% 70% at 50% 30%,#0a4a85,#002a52 75%)}
#party.on{opacity:1;visibility:visible;transition:opacity .6s}
#party .spot{position:absolute;left:50%;top:-10%;width:1400px;height:1300px;margin-left:-700px;background:conic-gradient(from 180deg at 50% 0%,rgba(255,255,255,0) 160deg,rgba(255,240,200,.16) 172deg,rgba(255,255,255,0) 180deg,rgba(255,240,200,.16) 188deg,rgba(255,255,255,0) 200deg);animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#party .txt{position:absolute;left:120px;right:120px;top:70px;text-align:center;z-index:3}
#party .kind{display:inline-block;font-size:44px;font-weight:800;padding:12px 40px 14px;border-radius:99px;background:var(--gold);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.18)}
#party .big{display:inline-block;margin-top:28px;font-size:136px;font-weight:800;line-height:1.05;padding:10px 60px 22px;border-radius:70px;background:rgba(0,30,60,.55);box-shadow:inset 0 3px 0 rgba(255,255,255,.18);white-space:nowrap;max-width:100%}
#party .big.house{background:var(--c);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 14px 30px rgba(0,0,0,.3)}
#party .big.house.Makkah{color:var(--ink)}
#party .det{margin-top:22px;font-size:46px;font-weight:700;color:#e3eefa}
#party .duo{position:absolute;left:0;right:0;bottom:24px;height:620px;z-index:2}
#party .txt>*{opacity:0;transform:translateY(24px) scale(.96)}
#party.on .txt>*{opacity:1;transform:none;transition:opacity .6s,transform .7s cubic-bezier(.3,1.5,.5,1)}
#party.on .txt .big{transition-delay:.18s}#party.on .txt .det{transition-delay:.32s}
.fx{position:absolute;left:0;top:0;width:0;height:0;z-index:1;pointer-events:none}
.fx i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);background:var(--k);border-radius:2px;opacity:0;animation:pop var(--d) cubic-bezier(.1,.7,.3,1) var(--w) forwards}
.fx i.st{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border-radius:0}
.fx i.ci{border-radius:50%}
.fx i.rb{height:calc(var(--s)*.38)}
@keyframes pop{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
.flash{position:absolute;width:0;height:0;z-index:3}
.flash:before{content:"";position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,236,160,.85) 30%,rgba(255,236,160,0));animation:flash .7s ease-out forwards}
@keyframes flash{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
#net{position:fixed;right:2vw;bottom:2vh;font:700 2.2vh "Atkinson Next",system-ui,sans-serif;padding:1vh 2vh;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;display:none}
#off{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--deep);font-size:4vh;font-weight:800;padding:5vw}
@media (prefers-reduced-motion:reduce){
 .bub,.twk,#sky .glow,.kp,.crown,.card .ic,#party .spot{animation:none!important}
 .bub{display:none}
 .scene,.col,.plat,.title{transition:opacity .4s!important}
 #party .txt>*{transition:none!important}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><div class="glow"></div></div>
<div id="stage">
 <header>
  <div class="brand"><span class="badge"><img src="/logo.png" alt="" width="88" height="88"></span><div><b>Safar Academy</b><small>Enfield</small></div></div>
  <div class="title" id="title"></div>
  <div class="clock" id="clock"></div>
 </header>
 <main id="main"></main>
 <footer><div class="dots" id="dots"></div><div class="pg" id="pg"></div><div class="bar"><i id="bar"></i></div></footer>
 <div id="party" aria-live="polite"><div class="spot"></div><div class="txt" id="ptxt"></div><div class="duo" id="pduo"></div></div>
</div>
<div id="net">Reconnecting…</div>
<div id="off"></div>
<script>
(function(){
"use strict";
/* ---------- Settings ---------- */
var DATA_MS=30000,SCENE_MS={houses:22000,primary:15000,secondary:15000,stars:13000,books:13000};
var STARS_PER_PAGE=6,BOOKS_PER_PAGE=8,ORDER=["houses","primary","secondary","stars","books"];
var path=location.pathname.replace(/\/+$/,""),STAFF=path==="/tv",URL=STAFF?"/api/tv":path+"/data",SEEN=STAFF?"/api/tv/seen":path+"/seen";
var Q=location.search,PREVIEW=/[?&]preview\b/.test(Q),START=(Q.match(/[?&]scene=([a-z]+)/)||[])[1],PLAY=(Q.match(/[?&]play=([a-z]+)/)||[])[1];
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var CAN_ANIM=typeof document.body.animate==="function";
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function fmt(n){return Number(n||0).toLocaleString("en-GB")}

/* ---------- Stage scaling: one 1920 x 1080 picture on every screen ---------- */
function fitStage(){var s=Math.min(innerWidth/1920,innerHeight/1080);var st=$("stage");
 st.style.transform="translate("+((innerWidth-1920*s)/2)+"px,"+((innerHeight-1080*s)/2)+"px) scale("+s+")";st.style.left="0";st.style.top="0"}
fitStage();window.addEventListener("resize",fitStage);

/* ---------- Background ---------- */
(function(){var sky=$("sky");for(var i=0;i<16;i++){var b=h("i","bub"),s=40+Math.random()*130;
  b.style.cssText="--t:"+["rgba(255,196,96,.14)","rgba(255,143,163,.13)","rgba(124,192,242,.14)","rgba(124,214,168,.12)"][i%4]+";left:"+(Math.random()*100)+"%;width:"+s+"px;height:"+s+"px;--sway:"+(Math.random()*120-60)+"px;animation-duration:"+(38+Math.random()*50)+"s;animation-delay:-"+(Math.random()*80)+"s;opacity:"+(.35+Math.random()*.5);sky.appendChild(b)}
 for(i=0;i<34;i++){var t=h("i","twk");t.style.cssText="left:"+(Math.random()*100)+"%;top:"+(Math.random()*62)+"%;animation-duration:"+(2.5+Math.random()*4)+"s;animation-delay:-"+(Math.random()*6)+"s";sky.appendChild(t)}})();

/* ---------- Illustrations (house landmarks, crown, star, book) ---------- */
var OUT='stroke="#3a2614" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
var LAND={

  pod.appendChild(c);var plat=c.querySelector(".plat");plat.dataset.h=heightFor(r,false)});
 kids=[new Kid(pod,"b",120,300),new Kid(pod,"g",W-120,300)];
 sec._enter=function(){Array.prototype.forEach.call(sec.querySelectorAll(".plat"),function(p,i){var r=+p.parentNode.className.match(/r(\d)/)[1];
   p.style.transitionDelay=RM?"0s":(r===1?.55:r===2?.3:.05)+"s";p.style.height=p.dataset.h+"px"});
  Array.prototype.forEach.call(sec.querySelectorAll(".who b"),function(e){fitText(e,30)});
  life=idle(kids,{point:true,first:4000});
  var n=0,pairMs=Math.max(4000,Math.min(PAIR_MS,58000/turns));if(turns>1)tick=setInterval(function(){n++;Array.prototype.forEach.call(sec.querySelectorAll(".names"),function(box){var P=box.querySelectorAll(".pair");
   if(P.length<2)return;var i=n%P.length;Array.prototype.forEach.call(P,function(p,j){p.classList.toggle("on",j===i)});
   var lab=box.parentNode.querySelector(".more");if(lab)lab.firstChild.textContent=(i*2+1)+(i*2+2<=+lab.dataset.n?"–"+(i*2+2):"")})},pairMs)};
 sec._leave=function(){clearInterval(tick);if(life)life.stop();kids.forEach(function(k){k.stop()})};
 sec._ms=Math.max(SCENE_MS[stage],Math.min(60000,turns*PAIR_MS+1500));
 return sec}

/* An encouraging empty state: the two characters and a friendly line. */
function emptyInto(sec,title,line){sec.innerHTML='<div class="empty"><h2>'+esc(title)+'</h2><p>'+esc(line)+'</p></div>';
 var duo=h("div","pod");sec.appendChild(duo);var kids=[new Kid(duo,"b",W/2-170,400),new Kid(duo,"g",W/2+170,400)],life=null;
 sec._enter=function(){var ctx={layer:duo,w:W,h:H,colours:["#f5c542","#ffffff","#7cc0f2"]};var t=LIB.encourage(kids[0],kids[1],ctx);
  life=idle(kids,{first:t+3000,every:9000})};
 sec._leave=function(){if(life)life.stop();kids.forEach(function(k){k.stop()})}}

function starsScene(page){var S=data.stars,sec=h("section","scene");
 if(!S.length){emptyInto(sec,"Stars of the week are coming","Every pass and merit counts!");return sec}
 var P=S.slice(page*STARS_PER_PAGE,(page+1)*STARS_PER_PAGE),n=P.length,cols=n<=2?n:n<=4?2:3,rows=Math.ceil(n/cols);
 var g=h("div","cards");g.style.gridTemplateColumns="repeat("+cols+",minmax(0,1fr))";g.style.top=(rows===1?150:0)+"px";if(rows===1)g.style.bottom="150px";
 g.innerHTML=P.map(function(s){if(!s.name)return '<div class="card none"><span class="cls">'+esc(s.class)+'</span><div class="nm">Could it be you?</div><div class="why">Earn passes and merits this week</div></div>';
  return '<div class="card" style="--c:'+(HC[s.house]||"var(--gold)")+'"><span class="ic">'+STAR+'</span><span class="cls">'+esc(s.class)+'</span><div class="nm">'+esc(s.name)+'</div><div class="why">'+(s.chosen?"<b>Teacher's star</b> · ":"")+s.passes+(s.passes===1?" pass":" passes")+", "+s.merits+(s.merits===1?" merit":" merits")+'</div></div>'}).join("");
 sec.appendChild(g);sec._enter=function(){Array.prototype.forEach.call(sec.querySelectorAll(".nm"),function(e){fitText(e,34)})};return sec}

function booksScene(page){var B=data.books,sec=h("section","scene");
 if(!B.length){emptyInto(sec,"No books completed yet this month","Keep reading. Your name could be here!");return sec}
 var P=B.slice(page*BOOKS_PER_PAGE,(page+1)*BOOKS_PER_PAGE),n=P.length,cols=n<=3?n:4,rows=Math.ceil(n/cols);
 sec.appendChild(h("div","bookhead",'<b>'+B.length+'</b>'+(B.length===1?"pupil has":"pupils have")+" completed a book in "+esc(data.month)));
 var g=h("div","cards");g.style.gridTemplateColumns="repeat("+cols+",minmax(0,1fr))";g.style.top=(rows===1?260:130)+"px";if(rows===1)g.style.bottom="120px";
 g.innerHTML=P.map(function(b){return '<div class="card book" style="--c:'+(HC[b.house]||"var(--gold)")+'"><span class="bk">'+BOOK(HC[b.house]||"#e9a21a")+'</span><div class="nm">'+esc(b.name)+'</div><div class="why">'+esc(b.class)+'</div></div>'}).join("");
 sec.appendChild(g);sec._enter=function(){Array.prototype.forEach.call(sec.querySelectorAll(".nm"),function(e){fitText(e,32)})};return sec}

var TITLES={houses:["House points","Who's leading the school"],primary:["Memorisation champions","Most passes in {m}","Primary"],
 secondary:["Memorisation champions","Most passes in {m}","Secondary"],stars:["Stars of the week","Chosen by teachers, or the most passes and merits since Monday"],books:["Book completions","Well done, everyone who finished a book in {m}"]};

/* The rotation: one entry per scene, with stars and books split into pages. */
function plan(){var L=["houses","primary","secondary"];
 for(var i=0;i<Math.max(1,Math.ceil(data.stars.length/STARS_PER_PAGE));i++)L.push("stars:"+i);
 for(i=0;i<Math.max(1,Math.ceil(data.books.length/BOOKS_PER_PAGE));i++)L.push("books:"+i);return L}
var cur=null,curSec=null,ends=0,dur=1,started=0;
function nextKey(){var L=plan();if(!cur)return START&&L.filter(function(k){return k.split(":")[0]===START})[0]||L[0];
 var i=L.indexOf(cur);if(i>=0)return L[(i+1)%L.length];
 var t=ORDER.indexOf(cur.split(":")[0]),p=+(cur.split(":")[1]||0);
 for(var j=0;j<L.length;j++){var tj=ORDER.indexOf(L[j].split(":")[0]),pj=+(L[j].split(":")[1]||0);if(tj>t||(tj===t&&pj>p))return L[j]}return L[0]}
function show(key,before){var type=key.split(":")[0],page=+(key.split(":")[1]||0),old=curSec,sec;
 if(old&&old._leave)old._leave();
 if(type==="houses"){sec=houseScene().sec;if(!sec.parentNode)main.appendChild(sec);paintHouses(true,before);
  if(before)setTimeout(function(){if(cur==="houses")paintHouses(false)},RM?800:2600);var S=HS;S.life=idle(S.kids,{point:true,first:5000})}
 else{sec=type==="stars"?starsScene(page):type==="books"?booksScene(page):champScene(type);main.appendChild(sec)}
 if(old&&old!==sec){if(old===(HS&&HS.sec)){if(HS.life)HS.life.stop();HS.kids.forEach(function(k){k.stop()})}
  old.classList.remove("on");(function(o){setTimeout(function(){if(o!==(HS&&HS.sec))o.remove()},800)})(old)}
 void sec.offsetWidth;sec.classList.add("on");if(sec._enter)sec._enter();
 if(type==="houses")sec._leave=function(){};
 cur=key;curSec=sec;dur=sec._ms||SCENE_MS[type];started=Date.now();ends=started+dur;
 var T=TITLES[type],sub=T[1].replace("{m}",esc(data.month));
 $("title").innerHTML='<h1>'+esc(T[0])+(T[2]?'<em>'+T[2]+'</em>':'')+'</h1><p>'+sub+'</p>';
 var n=type==="stars"?Math.ceil(data.stars.length/STARS_PER_PAGE):type==="books"?Math.ceil(data.books.length/BOOKS_PER_PAGE):1;
 $("pg").textContent=n>1?"Page "+(page+1)+" of "+n:"";
 $("dots").innerHTML=ORDER.map(function(o){return '<i'+(o===type?' class="on"':'')+'></i>'}).join("")}

/* A steady clock drives the rotation; it simply stops counting while a celebration is on screen. */
var last=Date.now();
setInterval(function(){var now=Date.now(),dt=now-last;last=now;if(!data)return;
 if(partyOn){ends+=dt;return}
 if(toPodium&&!queue.length){toPodium=false;repaint=false;if(cur!=="houses"&&shownHouses){show("houses",shownHouses);return}else repaint=true}
 if(repaint&&!queue.length){repaint=false;if(cur==="houses"){paintHouses(false);ends=Math.max(ends,now+6000)}}
 if(queue.length&&now-started>4000){celebrate();return}
 if(now>=ends)show(nextKey());
 $("bar").style.width=(100*Math.min(1,1-(ends-now)/dur))+"%"},200);

/* ---------- Celebrations ---------- */
var queue=[],partyOn=false,queued={},repaint=false,toPodium=false;
var KIND={book:["Book completed!","book"],level:["Level complete!","applause"],star:["Star of the week","highfive"],house:["House milestone","highfive"],
 school:["School milestone","milestone"],leader:["New leader!","milestone"],books:["Books completed!","applause"]};
var party=null;
function enqueue(events,preview){var fresh=events.filter(function(e){return !queued[e.id]});fresh.forEach(function(e){queued[e.id]=1});
 var books=fresh.filter(function(e){return e.kind==="book"}),rest=fresh.filter(function(e){return e.kind!=="book"});
 /* Lots of books at once become one celebration, so the screen gets back to its scenes. */
 if(books.length>3){rest.unshift({ids:books.map(function(e){return e.id}),kind:"books",title:books.length+" books completed!",name:books.length+" pupils",
   detail:books.slice(0,5).map(function(e){return e.name}).join(", ")+(books.length>5?" and "+(books.length-5)+" more":""),house:""});fresh=rest}
 fresh.forEach(function(e){e.preview=!!preview;queue.push(e)})}
function celebrate(){var e=queue.shift();if(!e)return;partyOn=true;
 if(!party){var duo=$("pduo");party={duo:duo,kids:[new Kid(duo,"b",960-230,520),new Kid(duo,"g",960+230,520)]}}
 var k=(KIND[e.kind]||KIND.level).slice();if(e.anim&&LIB[e.anim])k[1]=e.anim;var isHouse=e.kind==="house"||e.kind==="leader";
 $("ptxt").innerHTML='<div><span class="kind">'+esc(e.title||k[0])+'</span></div><div class="big'+(isHouse?' house '+esc(e.name):'')+'"'+(isHouse?' style="--c:'+(HC[e.name]||"")+'"':'')+'>'+esc(e.name)+'</div>'+(e.detail?'<div class="det">'+esc(e.detail)+'</div>':'');
 var big=$("ptxt").querySelector(".big");$("party").classList.add("on");setTimeout(function(){fitText(big,56)},30);
 var colours=["#f5c542","#ffffff","#ff8fa3",HC[e.house]||"#7cc0f2","#7cd6a8"],b=party.kids[0],g=party.kids[1];
 b.stop();g.stop();
 var ctx={layer:party.duo,w:1920,h:620,colours:colours},t=1200;
 setTimeout(function(){if(RM){b.set("cheer");g.set("cheer");return}t=LIB[k[1]](b,g,ctx)},700);
 var total=700+(RM?4000:({highfive:6000,applause:4000,book:5000,milestone:5000,encourage:3000}[k[1]]||5000))+900;
 setTimeout(function(){$("party").classList.remove("on");setTimeout(function(){b.stop();g.stop();partyOn=false;last=Date.now()},650)},total);
 /* After a house moves into the lead, the podium comes back on and the houses glide to their new places. */
 if((e.kind==="leader"||e.kind==="house")&&!e.preview)toPodium=true;
 if(!e.preview)ack(e.ids||[e.id])}
function ack(ids){fetch(SEEN,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-Dashboard-Request":"1"},body:JSON.stringify({ids:ids})}).catch(function(){
  /* If this fails the event may come back once; that's better than losing it. */ queued={}})}

/* ---------- Data, with automatic recovery ---------- */
var fails=0,timer=null;
function load(){clearTimeout(timer);var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort()},15000);
 fetch(URL,{credentials:"same-origin",cache:"no-store",signal:ctl&&ctl.signal}).then(function(r){clearTimeout(to);
  if(r.status===404||r.status===401){$("off").style.display="flex";$("off").textContent=r.status===404?"This screen's link has been turned off. Ask an administrator for a new one.":"Sign in to see the dashboard.";return null}
  if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){if(!d){timer=setTimeout(load,DATA_MS*2);return}
  fails=0;$("net").style.display="none";$("off").style.display="none";var first=!data;data=d;
  if(d.events&&d.events.length)enqueue(d.events);
  if(first){show(nextKey());if(PREVIEW)enqueue(previewEvents(),true);if(PLAY)enqueue([{id:"play",kind:"level",title:"Preview",name:"Test Pupil A.",detail:PLAY,house:"Al-Aqsa",anim:PLAY}],true)}
  /* New standings glide into place on the podium, after any celebration, so everyone sees the change. */
  else if(cur==="houses"){if(queue.length||partyOn)repaint=true;else paintHouses(false)}
  timer=setTimeout(load,DATA_MS)}).catch(function(){clearTimeout(to);fails++;if(fails>=2||!data)$("net").style.display="block";
  /* Keep showing the last data and try again, a little less often each time. */
  timer=setTimeout(load,Math.min(60000,4000*Math.pow(2,fails-1)))})}
window.addEventListener("online",load);
load();
/* Pick up new versions of this page, unless the network is down. */
setInterval(function(){fetch(location.href,{cache:"no-store"}).then(function(r){if(r.ok)location.reload()}).catch(function(){})},6*3600*1000);

/* ?preview plays one of each celebration with made-up pupils, and ?play=highfive (applause, book, milestone,
   encourage) plays one animation. Nothing is saved and real events are unaffected. */
function previewEvents(){return [
 {id:"p1",kind:"star",title:"Star of the week",name:"Test Pupil A.",detail:"Preview class",house:"Al-Aqsa"},
 {id:"p2",kind:"book",title:"Book completed!",name:"Test Pupil B.",detail:"Preview class",house:"Madinah"},
 {id:"p3",kind:"level",title:"Level complete!",name:"Test Pupil C.",detail:"Qaidah Level 4 · Preview class",house:"Makkah"},
 {id:"p4",kind:"house",title:"500 house points!",name:"Madinah",detail:"A house milestone",house:"Madinah"},
 {id:"p5",kind:"school",title:"2,500 points together!",name:"Safar Academy",detail:"Every house helped",house:""},
 {id:"p6",kind:"leader",title:"New house in the lead!",name:"Al-Aqsa",detail:"Preview",house:"Al-Aqsa"}]}
})();
</script>
