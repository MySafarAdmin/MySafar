<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>Safar Academy · Live</title>
<style>
@font-face{font-family:"Atkinson Next";src:url(/fonts/atkinson-next-latin.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* Student-facing display. Every slide is its own little world (the sea, a beach, a rainforest...) that keeps moving
   while it is on, with teachers' names drifting through on fish, birds, beach balls, insects and lanterns. Slides change every
   30 seconds with a crossfade and a slow push in, so the screen never cuts. Everything is sized in vh for a 16:9 TV. */
:root{--navy:#002848;--ink:#0b2340;--mute:#5b7089;--gold:#f5c542;--gold2:#d99a00;--silver:#dfe6ee;--silver2:#9fb0c2;--bronze:#efaa72;--bronze2:#b86a2e;
 --makkah:#e9a400;--aqsa:#2a9fe6;--madinah:#1fae72;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:"Atkinson Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0;overflow:hidden}
/* ---------- Slides and the change between them ---------- */
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.06);transition:opacity 1.4s ease,transform 2.2s cubic-bezier(.2,.7,.2,1)}
.slide.on{opacity:1;transform:none}
.slide.out{opacity:0;transform:scale(1.035);transition:opacity 1.2s ease,transform 1.4s ease-in}
.slide:not(.on) *,.slide.out *{animation-play-state:paused!important}
.scene{position:absolute;inset:0}
.scene svg.land{position:absolute;left:0;bottom:0;width:100%;height:100%}
.carriers{position:absolute;inset:0;pointer-events:none;z-index:2}
.content>*{position:relative;z-index:1}.content>.title{z-index:3}
.content{position:absolute;inset:13vh 3vw 3.4vh;display:flex;flex-direction:column}
/* ---------- Header ---------- */
header{position:fixed;z-index:5;top:2.2vh;left:2.4vw;right:2.4vw;display:flex;align-items:center;gap:1.4vw;pointer-events:none}
.brand{display:flex;align-items:center;gap:1vw;background:var(--navy);border-radius:99px;padding:.8vh 2vw .8vh .8vh;box-shadow:0 .6vh 0 rgba(0,20,40,.25)}
.badge{width:7vh;height:7vh;border-radius:50%;background:#fff;display:grid;place-items:center}
.badge img{width:6vh;height:6vh}
.brand h1{margin:0;font-size:3.4vh;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.brand h1 small{display:block;font-size:1.9vh;font-weight:600;color:#bcd2e8;letter-spacing:0}
.mode{background:var(--gold);color:#2b1d00;font-weight:800;font-size:2.3vh;border-radius:99px;padding:.9vh 1.6vw}
.mode:empty{display:none}
.spacer{flex:1}
.dots{display:flex;gap:.9vh;background:var(--navy);border-radius:99px;padding:1.1vh 1.2vw}
.dots i{width:1.4vh;height:1.4vh;border-radius:50%;background:rgba(255,255,255,.35);transition:background .6s,transform .6s}
.dots i.on{background:var(--gold);transform:scale(1.35)}
.clock{font-size:4.4vh;font-weight:800;background:var(--navy);border-radius:99px;padding:.6vh 1.6vw;box-shadow:0 .6vh 0 rgba(0,20,40,.25)}
footer{position:fixed;z-index:5;left:0;right:0;bottom:0;height:.9vh;background:rgba(0,40,72,.5)}
footer i{display:block;height:100%;width:0;background:var(--gold)}
footer i.run{width:100%;transition:width linear}
/* ---------- Titles ---------- */
.title{align-self:flex-start;background:var(--navy);border-radius:2.4vh;padding:1.4vh 2.6vw 1.5vh;box-shadow:0 .8vh 0 rgba(0,20,40,.25);animation:drop 1s .35s both cubic-bezier(.2,.9,.3,1.2)}
.title h2{margin:0;font-size:6vh;font-weight:800;letter-spacing:-.015em;line-height:1.05}
.title p{margin:.5vh 0 0;font-size:2.5vh;font-weight:600;color:#cfe0f0}
.title .pg{color:var(--gold);margin-left:1vw}
@keyframes drop{from{opacity:0;transform:translateY(-3vh)}}
/* ---------- Podium ---------- */
.podium{flex:1;min-height:0;display:grid;grid-template-columns:24vw 28vw 24vw;justify-content:center;align-items:end;gap:0 1vw;padding-top:2vh}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.who{display:flex;flex-direction:column;gap:1vh;align-items:stretch;margin-bottom:1.6vh;position:relative}
.pc{background:#fff;color:var(--ink);border-radius:2vh;padding:1.4vh 1vw 1.5vh;text-align:center;box-shadow:0 .7vh 0 rgba(0,20,40,.22);border-bottom:.7vh solid var(--hc,#c9d6e3);animation:pop .7s both cubic-bezier(.3,1.6,.5,1)}
.pc .pn{display:block;font-size:4.2vh;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.pc .pcl{display:block;font-size:2.3vh;font-weight:600;color:var(--mute);margin-top:.3vh}
.p1 .pc .pn{font-size:5vh}
.pc.cls .pcl{font-size:3vh;font-weight:700;color:var(--ink)}
.more{text-align:center;font-weight:800;font-size:2.4vh;background:rgba(0,40,72,.8);border-radius:99px;padding:.6vh 1vw;animation:pop .7s both}
.step{position:relative;border-radius:2vh 2vh 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1.6vh;color:#2b1d00;overflow:hidden;
 box-shadow:inset 0 1.4vh 0 rgba(255,255,255,.35),inset 0 -2.2vh 0 rgba(0,0,0,.1),0 .8vh 0 rgba(0,20,40,.22);animation:rise 1.1s both cubic-bezier(.2,.9,.25,1.1);transform-origin:bottom}
.step b{font-size:9vh;font-weight:800;line-height:1}
.step span{font-size:2.6vh;font-weight:800;margin-top:.4vh;opacity:.85}
.p1 .step{height:36vh;background:var(--gold)}
.p2 .step{height:27vh;background:var(--silver);color:#26313d}
.p3 .step{height:20vh;background:var(--bronze);color:#3a1c05}
.p3 .step b{font-size:7vh}
.step.none{opacity:.45}
/* First place: it rises last, then keeps a crown bobbing and light sweeping over the gold. */
.p2 .step,.p2 .pc{animation-delay:.55s}.p3 .step,.p3 .pc{animation-delay:.75s}.p1 .step{animation-delay:.95s}.p1 .pc{animation-delay:1.35s}
.p1 .step::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3);clip-path:polygon(30% 0,42% 0,22% 100%,10% 100%);transform:translateX(-120%);animation:sweep 4.5s 2.4s infinite}
.p1 .who{animation:float 4s 2s ease-in-out infinite}
.crown{position:absolute;left:50%;top:-6.4vh;width:8vh;margin-left:-4vh;animation:pop .8s 1.7s both cubic-bezier(.3,1.6,.5,1)}
.crown svg{width:100%;display:block;animation:bob 2.6s 2.5s ease-in-out infinite}
.spark{position:absolute;width:2.4vh;height:2.4vh;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.2s infinite}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(3vh)}}
@keyframes sweep{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
@keyframes float{50%{transform:translateY(-1vh)}}
@keyframes bob{50%{transform:translateY(-.8vh) rotate(-4deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.empty{margin:auto;background:rgba(0,40,72,.82);border-radius:3vh;padding:4vh 4vw;font-size:4.4vh;font-weight:800;text-align:center;animation:pop .9s .6s both}
.empty small{display:block;font-size:2.6vh;color:#cfe0f0;font-weight:600;margin-top:1vh}
/* ---------- Names that take turns ---------- */
.cycle{flex:1;min-height:0;position:relative;margin-top:2.4vh}
.names{position:absolute;inset:0;display:grid;gap:2vh 1.6vw;align-content:center;justify-content:center}
.names.leave .nc{animation:leave .6s both ease-in}
.nc{background:#fff;color:var(--ink);border-radius:2.4vh;padding:2.2vh 2vw 2.4vh;box-shadow:0 .8vh 0 rgba(0,20,40,.22);border-left:1vh solid var(--hc,#c9d6e3);min-width:0;animation:pop .75s both cubic-bezier(.3,1.5,.5,1)}
.nc .pn{display:block;font-size:1em;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.nc .pcl{display:block;font-size:.5em;font-weight:600;color:var(--mute);margin-top:.4vh}
.nc .wk{display:inline-block;font-size:.45em;font-weight:800;color:#5b4200;background:#ffe9a6;border-radius:99px;padding:.3vh .8vw;margin-top:.8vh}
.names.solo .nc{text-align:center;padding:4vh 5vw;border-left:0;border-bottom:1.2vh solid var(--hc,#c9d6e3);animation:pop 1s both cubic-bezier(.3,1.5,.5,1),float 5s 1.2s ease-in-out infinite}
@keyframes leave{to{opacity:0;transform:scale(.85) translateY(-2vh)}}
.Makkah{--hc:var(--makkah)}.Al-Aqsa{--hc:var(--aqsa)}.Madinah{--hc:var(--madinah)}
/* ---------- Teachers' names riding through ---------- */
.rider{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.rider .tag{background:#fff;color:var(--ink);font-weight:800;font-size:2.4vh;border-radius:99px;padding:.5vh 1.2vw;white-space:nowrap;box-shadow:0 .5vh 0 rgba(0,20,40,.3);margin-top:.4vh}
.rider .tag:empty{display:none}
.rider .art{display:block}
.rider .art{transform-origin:50% 50%;will-change:transform}
.wg{transform-box:view-box;animation:wg .08s ease-in-out infinite alternate}
.flapx{transform-box:fill-box;transform-origin:0 50%;animation:flapx .28s ease-in-out infinite alternate}
.flapx.r{transform-origin:100% 50%}
.wx{transform-box:fill-box;transform-origin:0 50%}.wx.r{transform-origin:100% 50%}
.wing{transform-box:fill-box;transform-origin:30% 100%}.thrust{transform-box:fill-box;transform-origin:100% 50%}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .12s infinite alternate}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.2s linear infinite}
@keyframes wg{from{transform:rotate(-24deg)}to{transform:rotate(30deg) scaleY(.7)}}
@keyframes flapx{to{transform:scaleX(.25)}}
@keyframes flame{to{transform:scaleY(1.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- Scenery that keeps moving ---------- */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.drift{position:absolute;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.cloud{position:absolute;left:0;width:22vw;height:7vh;background:#fff;border-radius:99px}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:9vw;height:9vw;left:3vw;bottom:2vh}.cloud::after{width:6vw;height:6vw;left:10vw;bottom:2.5vh}
.bub{position:absolute;bottom:-4vh;border-radius:50%;border:.25vh solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:up linear infinite}
@keyframes up{to{transform:translate(2vw,-115vh)}}
.ray{position:absolute;top:-20vh;width:9vw;height:120vh;background:rgba(255,255,255,.08);transform-origin:50% 0;animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{transform:rotate(14deg);opacity:.5}to{transform:rotate(22deg);opacity:1}}
.tw{position:absolute;width:.5vh;height:.5vh;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.fly{position:absolute;width:1.1vh;height:1.1vh;border-radius:50%;background:#f4ff7a;outline:.6vh solid rgba(244,255,122,.25);animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0);opacity:.2}30%{opacity:1}100%{transform:translate(6vw,-8vh);opacity:.4}}
.sun{position:absolute;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 2.2vh rgba(255,210,63,.3),0 0 0 4.6vh rgba(255,210,63,.14);animation:glow 4s ease-in-out infinite alternate}
.sun::before{display:none}
@keyframes glow{to{box-shadow:0 0 0 3vh rgba(255,210,63,.3),0 0 0 6.4vh rgba(255,210,63,.12)}}
.wave{position:absolute;left:0;width:200%;animation:wave linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.mist{position:absolute;left:-20vw;width:80vw;height:12vh;border-radius:99px;background:rgba(255,255,255,.18);animation:mist 26s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(60vw)}}
.shoot{position:absolute;width:12vw;height:.35vh;background:#fff;border-radius:99px;opacity:0;animation:shoot 9s ease-in infinite}
@keyframes shoot{0%,82%{opacity:0;transform:translate(0,0) rotate(18deg)}86%{opacity:1}100%{opacity:0;transform:translate(40vw,13vh) rotate(18deg)}}
.glowwin{animation:tw 4s ease-in-out infinite}
.confetti{position:absolute;width:1.2vh;height:1.8vh;border-radius:.3vh;pointer-events:none}
#ctl{position:fixed;z-index:8;right:2vw;bottom:3vh;display:flex;gap:.8vw;opacity:0;transition:opacity .4s}
#ctl.on,#ctl:focus-within{opacity:1}
#ctl button{font:inherit;font-size:2.2vh;font-weight:800;color:#fff;background:var(--navy);border:0;border-radius:99px;padding:1.1vh 1.6vw;cursor:pointer;box-shadow:0 .5vh 0 rgba(0,20,40,.3)}
#ctl button:focus-visible{outline:.4vh solid #ffd23f;outline-offset:.3vh}
#off{position:fixed;z-index:9;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--navy);font-size:4vh;font-weight:800;padding:5vw}
@media (prefers-reduced-motion:reduce){
 .slide,.slide.out{transition:opacity .6s}.slide{transform:none}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
 footer i.run{transition:none}.carriers{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<header><div class="brand"><span class="badge"><img src="/logo.png" alt="" width="80" height="80"></span><h1 id="brand">Safar Academy<small>Enfield</small></h1></div><span class="mode" id="mode"></span><span class="spacer"></span><div class="dots" id="dots"></div><div class="clock" id="clock"></div></header>
<footer><i id="prog"></i></footer>
<div id="off"></div>
<nav id="ctl" hidden><button type="button" id="fs">Full screen</button><button type="button" id="close">Close</button></nav>
<script>
(function(){
var SLIDE_MS=30000,DATA_MS=60000;
/* /presenter/<class> is a teacher's Presenter: the same scenes, for one class, with its students riding through. */
var path=location.pathname.replace(/\/+$/,""),PRESENT=path.indexOf("/presenter/")===0,
 URL=path==="/tv"?"/api/tv":PRESENT?"/api"+path:path+"/data";
/* Test hooks for previews: ?slide=<id> keeps one slide on, ?focus=qaidah or memo plays only those. */
var Q=new URLSearchParams(location.search),PIN=Q.get("slide"),FOCUS=Q.get("focus");
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var data=null,cur=null,curId=null,ST=null,PT=null,RT=null,teach=Math.floor(Math.random()*1e3);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function $(id){return document.getElementById(id)}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(L){return L[Math.floor(Math.random()*L.length)]}
function rep(n,f){var h="";for(var i=0;i<n;i++)h+=f(i);return h}
function plural(n,w){return n+" "+(n===1?w:/s$/.test(w)?w+"es":w+"s")}
function clock(){$("clock").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}

/* ---------- The worlds ----------
   Each has a sky (CSS background), scenery that loops on its own, and a rider: what carries a teacher's name across. */
var LAND='<svg class="land" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">';
/* Flat bands of colour instead of gradients: [top in vh, colour], each to the bottom of the screen. */
function bands(B){return B.map(function(b){return '<i style="position:absolute;left:0;right:0;bottom:0;top:'+b[0]+'vh;background:'+b[1]+'"></i>'}).join("")}
function clouds(n,top){return rep(n,function(i){var s=rnd(.6,1.2);return '<div class="drift" style="top:'+rnd(top[0],top[1])+'vh;animation-duration:'+rnd(70,110)+'s;animation-delay:-'+rnd(0,100)+'s"><div class="cloud" style="transform:scale('+s+')"></div></div>'})}
function stars(n,h){return rep(n,function(){return '<i class="tw" style="left:'+rnd(0,100)+'vw;top:'+rnd(0,h)+'vh;animation-delay:-'+rnd(0,3)+'s;transform:scale('+rnd(.6,1.6)+')"></i>'})}
function palm(x,flip){return '<g transform="translate('+x+',0)'+(flip?' scale(-1,1)':'')+'"><path d="M0 900 C10 760 40 640 120 520" stroke="#8a5a2b" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M0 900 C10 760 40 640 120 520" stroke="#a87440" stroke-width="10" fill="none" stroke-dasharray="14 18"/>'
 +'<g class="sway" style="animation-duration:4s">'+[[-150,40],[-70,-60],[30,-80],[130,-30],[170,60]].map(function(p){return '<path d="M120 520 Q'+(120+p[0]*.5)+' '+(500+p[1]-60)+' '+(120+p[0])+' '+(520+p[1]+40)+' Q'+(120+p[0]*.55)+' '+(520+p[1]-10)+' 120 520Z" fill="#2f9e4f"/>'}).join("")
 +'<circle cx="108" cy="540" r="16" fill="#6b4423"/><circle cx="132" cy="544" r="16" fill="#7a4e2a"/><circle cx="120" cy="560" r="16" fill="#5c3a1d"/></g></g>'}
function flower(x,y,c,d){return '<g class="sway" style="animation-duration:'+d+'s"><path d="M'+x+' 900 Q'+(x-8)+' '+(y+60)+' '+x+' '+y+'" stroke="#2e8b3e" stroke-width="7" fill="none"/>'+rep(6,function(i){var a=i*Math.PI/3;return '<circle cx="'+(x+Math.cos(a)*16)+'" cy="'+(y+Math.sin(a)*16)+'" r="13" fill="'+c+'"/>'})+'<circle cx="'+x+'" cy="'+y+'" r="11" fill="#ffd23f"/></g>'}
var W={
 balloons:{sky:"#8fd3ff",rider:"balloon",
  html:function(){return bands([[52,"#a9e0ff"],[66,"#c4ebff"]])+'<div class="sun" style="width:14vh;height:14vh;right:12vw;top:16vh"></div>'+clouds(5,[14,50])
   +LAND+'<path d="M0 760 Q300 640 640 720 T1300 690 T1600 700 V900 H0Z" fill="#7fd08a"/><path d="M0 820 Q400 720 820 800 T1600 770 V900 H0Z" fill="#4fb36a"/><path d="M0 870 Q500 820 1000 860 T1600 850 V900 H0Z" fill="#3a9a57"/></svg>'}},
 sea:{sky:"#0f7fc0",rider:"fish",
  html:function(){return bands([[38,"#0b6aa3"],[64,"#085890"],[84,"#064877"]])+rep(5,function(i){return '<div class="ray" style="left:'+(8+i*19)+'vw;animation-delay:-'+(i*1.7)+'s"></div>'})
   +rep(16,function(){var s=rnd(1,3.4);return '<i class="bub" style="left:'+rnd(0,100)+'vw;width:'+s+'vh;height:'+s+'vh;animation-duration:'+rnd(9,18)+'s;animation-delay:-'+rnd(0,18)+'s"></i>'})
   +LAND+'<path d="M0 820 Q400 780 800 815 T1600 800 V900 H0Z" fill="#d8b878"/><path d="M0 860 Q500 830 1000 855 T1600 845 V900 H0Z" fill="#c4a160"/>'
   +[[60,8],[140,6],[230,9],[1360,7],[1450,9],[1530,6]].map(function(p,i){return '<path class="sway" style="animation-duration:'+(3+i%3)+'s" d="M'+p[0]+' 860 C'+(p[0]-30)+' 760 '+(p[0]+30)+' 680 '+(p[0]-10)+' '+(860-p[1]*42)+'" stroke="'+(i%2?"#2f9e6b":"#3cbf7f")+'" stroke-width="16" fill="none" stroke-linecap="round"/>'}).join("")
   +'<g class="sway" style="animation-duration:6s"><path d="M380 860 q-10-90 30-120 q-30 50 10 70 q10-60 50-80 q-20 70 0 130Z" fill="#ff7a8a"/></g><g class="sway" style="animation-duration:5s"><path d="M1180 860 q-20-80 20-110 q-10 50 20 60 q0-50 40-70 q-10 70 -10 120Z" fill="#ffa24d"/></g>'
   +'<ellipse cx="560" cy="858" rx="70" ry="28" fill="#8b9aa8"/><ellipse cx="1040" cy="862" rx="50" ry="20" fill="#7b8b99"/></svg>'}},
 beach:{sky:"#7fd3fa",rider:"ball",
  html:function(){return bands([[34,"#9adcfb"],[44,"#b6e7fc"]])+'<div class="sun" style="width:16vh;height:16vh;right:9vw;top:15vh"></div>'+clouds(4,[14,36])
