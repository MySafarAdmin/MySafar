<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>Safar Academy · Live</title>
<style>
@font-face{font-family:"Atkinson Next";src:url(/fonts/atkinson-next-latin.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* Student-facing display in Safar navy. One thing per slide, centred and large enough to read across a room.
   Slides fade into each other every 30 seconds; while one is on, only light moves (a slow glow, a sheen on the gold).
   Everything is sized in vh for a 16:9 TV. */
:root{--bg:#002848;--bg2:#003b6b;--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.055);--text:#fff;--mute:#a9c3dd;
 --gold:#f5c542;--silver:#d7e0ea;--bronze:#e39a5b;--makkah:#f2b632;--aqsa:#4bb3f5;--madinah:#3ccf91;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 65%);color:var(--text);font-family:"Atkinson Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{display:flex;flex-direction:column;padding:2.4vh 2.6vw 0}
/* Two soft lights drift slowly behind everything, so the screen is never quite still. */
.glow{position:fixed;width:70vw;height:70vw;border-radius:50%;pointer-events:none;filter:blur(8vh);opacity:.5;z-index:0}
.glow.a{background:radial-gradient(circle,rgba(75,179,245,.22),transparent 60%);left:-25vw;top:-20vw;animation:roam 46s ease-in-out infinite alternate}
.glow.b{background:radial-gradient(circle,rgba(245,197,66,.14),transparent 60%);right:-25vw;bottom:-35vw;animation:roam 58s ease-in-out infinite alternate-reverse}
@keyframes roam{to{transform:translate(18vw,10vh)}}
header{position:relative;z-index:2;display:flex;align-items:center;gap:1.4vw}
header .badge{flex:none;width:8vh;height:8vh;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 .5vh rgba(255,255,255,.16)}
header img{width:6.8vh;height:6.8vh}
header h1{font-size:3.8vh;margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.05}
header h1 small{display:block;font-size:2.1vh;font-weight:600;color:var(--mute);letter-spacing:0}
.mode{margin-left:1vw;color:#2b1d00;background:var(--gold);font-weight:800;font-size:2.2vh;border-radius:99px;padding:.7vh 1.4vw}
.mode:empty{display:none}
.spacer{flex:1}
.dots{display:flex;gap:1vh}.dots i{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--line);transition:background .8s,transform .8s}.dots i.on{background:var(--gold);transform:scale(1.3)}
header .clock{font-size:4.8vh;font-weight:800;margin-left:1.6vw}
main{position:relative;z-index:1;flex:1;min-height:0}
footer{position:relative;z-index:2;height:.8vh;margin:0 -2.6vw;background:rgba(255,255,255,.08)}
footer i{display:block;height:100%;width:0;background:var(--gold)}
footer i.run{width:100%;transition:width linear}
/* ---------- A slide: it fades in as the last one fades out ---------- */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:3vh 0 3vh;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide.out{opacity:0;transition:opacity .9s ease}
.slide.out .lift{transform:translateY(-1.5vh);transition:transform .9s ease}
.slide:not(.on) *,.slide.out *{animation-play-state:paused}
.head{text-align:center;margin-bottom:2.6vh}
.eyebrow{font-size:2.3vh;font-weight:800;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.head h2{margin:.6vh 0 0;font-size:7vh;font-weight:800;letter-spacing:-.02em;line-height:1.02}
.head p{margin:.8vh 0 0;font-size:2.8vh;font-weight:600;color:var(--mute)}
.head .pg{color:var(--gold)}
.in{animation:in .9s both cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(2.4vh)}}
/* ---------- Podium ---------- */
.podium{flex:1;min-height:0;width:86vw;display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:0 1.6vw}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;text-align:center}
.who{display:flex;flex-direction:column;gap:1.4vh;margin-bottom:2.4vh}
.nm{font-size:5.4vh;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.nm small{display:block;font-size:.5em;font-weight:600;color:var(--mute);margin-top:.5vh}
.p1 .nm{font-size:7vh;color:var(--gold)}.p1 .nm small{color:#e9d9a8}
.house .nm{font-size:7vh}.p1.house .nm{font-size:8.6vh}
.nm.Makkah{color:var(--makkah)}.nm.Al-Aqsa{color:var(--aqsa)}.nm.Madinah{color:var(--madinah)}
.more{font-size:2.6vh;font-weight:700;color:var(--mute)}
.step{position:relative;border-radius:2vh 2vh 0 0;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-top:.9vh solid var(--m);overflow:hidden;
 display:flex;flex-direction:column;align-items:center;padding-top:2.4vh;transform-origin:bottom;animation:grow 1.1s both cubic-bezier(.2,.8,.2,1)}
.step b{font-size:11vh;font-weight:800;line-height:.9;color:var(--m)}
.step span{font-size:3vh;font-weight:800;margin-top:1.2vh}
.p1{--m:var(--gold)}.p2{--m:var(--silver)}.p3{--m:var(--bronze)}
.p1 .step{height:40vh}.p2 .step{height:30vh}.p3 .step{height:22vh}
.p3 .step b{font-size:9vh}
.step.none{opacity:.35}
/* Order of arrival: third, second, then first; names follow their step. */
.p3 .step{animation-delay:.3s}.p2 .step{animation-delay:.5s}.p1 .step{animation-delay:.75s}
.p3 .who{animation-delay:.8s}.p2 .who{animation-delay:1s}.p1 .who{animation-delay:1.3s}
/* First place keeps a slow glow behind it and a sheen across its step. */
.p1 .step::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,rgba(245,197,66,.28),transparent 70%);animation:breathe 5s 2s ease-in-out infinite alternate}
.p1 .step::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(-110%);animation:sheen 7s 2.5s ease-in-out infinite}
@keyframes grow{from{transform:scaleY(0);opacity:0}}
@keyframes breathe{from{opacity:.5}to{opacity:1}}
@keyframes sheen{0%{transform:translateX(-110%)}45%,100%{transform:translateX(110%)}}
.empty{margin:auto;text-align:center;font-size:4.6vh;font-weight:800}
.empty small{display:block;font-size:2.8vh;color:var(--mute);font-weight:600;margin-top:1.2vh}
/* ---------- Names that take turns ---------- */
.cycle{flex:1;min-height:0;width:86vw;position:relative}
.names{position:absolute;inset:0;display:grid;gap:2.2vh 1.8vw;align-content:center;justify-content:center}
.names.leave .nc{animation:out .7s both ease-in}
.nc{background:var(--panel);border:.2vh solid var(--line);border-left:.9vh solid var(--hc,var(--gold));border-radius:1.8vh;padding:2.6vh 2vw 2.8vh;min-width:0;animation:in .8s both cubic-bezier(.2,.8,.2,1)}
.nc .pn{display:block;font-size:1em;font-weight:800;line-height:1.08;overflow-wrap:anywhere}
.nc .pcl{display:block;font-size:.5em;font-weight:600;color:var(--mute);margin-top:.5vh}
.nc .wk{display:block;font-size:.42em;font-weight:800;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-top:.9vh}
.names.solo .nc{text-align:center;padding:5vh 4vw;border-left-width:.2vh;border-bottom:1.2vh solid var(--hc,var(--gold))}
@keyframes out{to{opacity:0;transform:translateY(-1.6vh)}}
.Makkah{--hc:var(--makkah)}.Al-Aqsa{--hc:var(--aqsa)}.Madinah{--hc:var(--madinah)}
#off{position:fixed;z-index:9;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--bg);font-size:4vh;font-weight:800;padding:5vw}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important}
 .slide,.slide.out{transition:opacity .4s}footer i.run{transition:none}}
</style>
</head>
<body>
<i class="glow a"></i><i class="glow b"></i>
<header><span class="badge"><img src="/logo.png" alt="" width="80" height="80"></span><h1>Safar Academy<small>Enfield</small></h1><span class="mode" id="mode"></span><span class="spacer"></span><div class="dots" id="dots"></div><div class="clock" id="clock"></div></header>
<main id="stage"></main>
<footer><i id="prog"></i></footer>
<div id="off"></div>
<script>
(function(){
var SLIDE_MS=30000,DATA_MS=60000;
var path=location.pathname.replace(/\/+$/,""),URL=path==="/tv"?"/api/tv":path+"/data";
/* Test hooks for previews: ?slide=<id> keeps one slide on, ?focus=qaidah or memo plays only those. */
var Q=new URLSearchParams(location.search),PIN=Q.get("slide"),FOCUS=Q.get("focus");
var data=null,cur=null,curId=null,ST=null,PT=null;
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function $(id){return document.getElementById(id)}
function plural(n,w){return n+" "+(n===1?w:/s$/.test(w)?w+"es":w+"s")}
function clock(){$("clock").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function month(){return data.month}

/* ---------- Podiums: the top three totals, everyone who shares a total on the same step ---------- */
function names(who,max,house){return who.slice(0,max).map(function(w){return '<div class="nm'+(house?' '+esc(w.house):'')+'">'+esc(w.name||w.class)+(w.name&&w.class?'<small>'+esc(w.class)+'</small>':'')+'</div>'}).join("")
 +(who.length>max?'<div class="more">and '+(who.length-max)+' more</div>':'')}
function podium(s){var steps=s.steps();if(!steps.length)return '<div class="empty in">'+esc(s.empty)+'<small>Who will be first?</small></div>';
 var by={};steps.forEach(function(x){by[x.place]=x});
 return '<div class="podium">'+[2,1,3].map(function(p){var x=by[p];return '<div class="col p'+p+(s.house?' house':'')+'"><div class="who in lift">'+(x?names(x.who,2,s.house):'')+'</div>'
  +'<div class="step'+(x?'':' none')+'"><b>'+p+'</b>'+(x?'<span>'+plural(x.n,s.unit)+'</span>':'')+'</div></div>'}).join("")+'</div>'}
function housePodium(){var steps=[];data.houses.forEach(function(h){if(!h.points)return;var last=steps[steps.length-1],w={name:h.house,house:h.house};
 if(last&&last.n===h.points)last.who.push(w);else if(steps.length<3)steps.push({place:steps.length+1,n:h.points,who:[w]})});return steps}
/* id, which window it belongs to, eyebrow, title, subtitle, and what it shows. */
var SLIDES=[
 {id:"houses",kind:"all",eye:"Houses",title:"House points",sub:function(){return "Who's leading the school"},steps:housePodium,unit:"point",house:1,empty:"No house points yet."},
 {id:"books",kind:"all",eye:"Well done",title:"Book passes",sub:function(){return "Finished a book in "+month()},list:function(){return data.books},empty:"No books finished yet this month."},
 {id:"memo",kind:"memo",eye:"Memorisation",title:"Most passes",sub:function(){return month()},steps:function(){return data.memo},unit:"pass",empty:"No memorisation passes yet this month."},
 {id:"qaidah",kind:"qaidah",eye:"Qaidah",title:"Most levels passed",sub:function(){return month()},steps:function(){return data.qaidah},unit:"level",empty:"No Qaidah levels passed yet this month."},
 {id:"qaidah-primary",kind:"qaidah",eye:"Qaidah · Primary",title:"Top class",sub:function(){return "Years 1 to 6, "+month()},steps:function(){return data.classes.qaidah.primary},unit:"level pass",empty:"No primary Qaidah levels passed yet."},
 {id:"memo-primary",kind:"memo",eye:"Memorisation · Primary",title:"Top class",sub:function(){return "Years 1 to 6, "+month()},steps:function(){return data.classes.memo.primary},unit:"pass",empty:"No primary memorisation passes yet."},
 {id:"qaidah-secondary",kind:"qaidah",eye:"Qaidah · Secondary",title:"Top class",sub:function(){return "Year 7 onwards, "+month()},steps:function(){return data.classes.qaidah.secondary},unit:"level pass",empty:"No secondary Qaidah levels passed yet."},
 {id:"memo-secondary",kind:"memo",eye:"Memorisation · Secondary",title:"Top class",sub:function(){return "Year 7 onwards, "+month()},steps:function(){return data.classes.memo.secondary},unit:"pass",empty:"No secondary memorisation passes yet."},
 {id:"stars",kind:"all",eye:"Stars of the week",title:"Our stars",sub:function(){return month()+", up to the end of last week"},list:function(){return data.stars},empty:"No stars of the week yet this month.",week:1}];
function focusNow(){if(FOCUS==="qaidah"||FOCUS==="memo")return [FOCUS];return data&&data.focus}
/* The slides for now: only that kind inside a screen's Qaidah or Memo time, and none with nothing to show. */
function playing(){if(PIN){var p=SLIDES.filter(function(s){return s.id===PIN});if(p.length)return p}
 var f=focusNow(),L=SLIDES.filter(function(s){return !f||f.indexOf(s.kind)>=0});
 var full=L.filter(function(s){return (s.steps?s.steps():s.list()).length});return full.length?full:L}
function build(s){var el=document.createElement("section");el.className="slide";
 el.innerHTML='<div class="head in lift"><div class="eyebrow">'+esc(s.eye)+'</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.sub())+'<span class="pg"></span></p></div>'+(s.steps?podium(s):'<div class="cycle"></div>');
 return el}
/* A list takes turns a page at a time so everyone is seen within the slide's 30 seconds:
   up to six pages, each at least five seconds, as many names on a page as that needs. */
function cycle(el,s){var L=s.list(),box=el.querySelector(".cycle");if(!L.length){box.innerHTML='<div class="empty in">'+esc(s.empty)+'<small>Keep going!</small></div>';return}
 var per=Math.ceil(L.length/Math.min(L.length,6)),pages=Math.ceil(L.length/per),i=0,pg=el.querySelector(".pg");
 var cols=per===4?2:per<=3?per:per<=9?3:per<=16?4:5,size=per===1?12:per<=2?8.4:per<=4?7:per<=6?5.8:per<=9?5:per<=16?4:3.2;
 function draw(){var P=L.slice(i*per,i*per+per),g=document.createElement("div");g.className="names lift"+(per===1?" solo":"");
  g.style.gridTemplateColumns=per===1?"minmax(0,64vw)":"repeat("+Math.min(cols,P.length)+",minmax(0,"+(per<=2?40:per===4?38:per<=9?28:20)+"vw))";g.style.fontSize=size+"vh";
  g.innerHTML=P.map(function(w,k){return '<div class="nc '+esc(w.house||"")+'" style="animation-delay:'+(.25+k*.09)+'s"><span class="pn">'+esc(w.name)+'</span><span class="pcl">'+esc(w.class)+'</span>'+(s.week?'<span class="wk">'+esc(w.label)+'</span>':'')+'</div>'}).join("");
  var old=box.querySelector(".names:not(.leave)");if(old){old.classList.add("leave");setTimeout(function(){old.remove()},750)}
  box.appendChild(g);var f=size;while(f>2.4&&g.scrollHeight>box.clientHeight+2){f-=.2;g.style.fontSize=f+"vh"}
  pg.textContent=pages>1?" · "+(i+1)+" of "+pages:""}
 draw();if(pages>1)PT=setInterval(function(){i=(i+1)%pages;draw()},SLIDE_MS/pages)}
function show(){if(!data)return;clearTimeout(ST);clearInterval(PT);
 var L=playing(),k=0;for(var j=0;j<L.length;j++)if(L[j].id===curId){k=(j+1)%L.length;break}
 var s=L[k],old=cur,el=build(s);curId=s.id;cur=el;
 if(old)old.classList.add("out");
 /* The new slide starts as the old one is half gone, so the change reads as one movement. */
 setTimeout(function(){$("stage").appendChild(el);void el.offsetWidth;el.classList.add("on");if(s.list)cycle(el,s);if(old)setTimeout(function(){old.remove()},900)},old?450:0);
 $("dots").innerHTML=L.map(function(x,j){return '<i'+(j===k?' class="on"':'')+'></i>'}).join("");
 var f=focusNow();$("mode").textContent=f&&!PIN?(f.length>1?"Qaidah and Memo time":f[0]==="qaidah"?"Qaidah time":"Memo time"):"";
 var p=$("prog");p.className="";p.style.transitionDuration="0ms";void p.offsetWidth;p.style.transitionDuration=SLIDE_MS+"ms";p.className="run";
 ST=setTimeout(show,SLIDE_MS)}
function load(){fetch(URL,{credentials:"same-origin",cache:"no-store"}).then(function(r){
  if(r.status===404||r.status===401){$("off").style.display="flex";$("off").textContent=r.status===404?"This screen's link has been turned off. Ask an administrator for a new one.":"Sign in to see the dashboard.";return null}
  return r.ok?r.json():null}).then(function(d){if(d){var first=!data;data=d;$("off").style.display="none";if(first)show()}}).catch(function(){/* keep showing the last data */})}
clock();setInterval(clock,1000);load();setInterval(load,DATA_MS);
/* Pick up new versions of this page, unless the network is down. */
setInterval(function(){fetch(location.href,{cache:"no-store"}).then(function(r){if(r.ok)location.reload()}).catch(function(){})},6*3600*1000);
})();
</script>
</body>
</html>
