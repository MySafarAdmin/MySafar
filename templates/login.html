{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}solo{% endblock %}
{% block content %}
<div class="card">
  {% include "_mark.html" %}
  <h1>Sign in</h1>
  <p class="lede">Use the email and password for your staff account.</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="username" spellcheck="false" required autofocus></label>
    <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in on this device for 30 days</label>
    <button class="btn primary">Sign in</button>
  </form>
  <div class="alt"><a href="/forgot">Forgotten your password?</a></div>
</div>
{% endblock %}
