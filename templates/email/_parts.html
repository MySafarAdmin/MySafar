{# Pieces shared by the HTML emails. Styles are inline because many email apps drop <style>. #}
{% set sans = "-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" %}
{% set serif = "Georgia,'Times New Roman',serif" %}

{% macro button(href, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 8px">
  <tr><td bgcolor="#003b6b" style="border-radius:8px">
    <a href="{{ href }}" target="_blank" style="display:inline-block;padding:13px 24px;font-family:{{ sans }};font-size:15px;font-weight:600;line-height:20px;color:#ffffff;text-decoration:none;border-radius:8px">{{ label }}</a>
  </td></tr>
</table>
{%- endmacro %}

{% macro fallback(href) -%}
<p style="margin:16px 0 0;font-family:{{ sans }};font-size:13px;line-height:1.5;color:#5b6470">If the button doesn't work, copy this link into your browser:<br>
<a href="{{ href }}" style="color:#003b6b;word-break:break-all">{{ href }}</a></p>
{%- endmacro %}

{% macro p(muted=False) -%}
<p style="margin:0 0 14px;font-family:{{ sans }};font-size:{{ '14px' if muted else '16px' }};line-height:1.6;color:{{ '#5b6470' if muted else '#3e4651' }}">{{ caller() }}</p>
{%- endmacro %}

{% macro facts(rows) -%}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:8px 0 6px;border-top:1px solid #e2e5e9">
  {% for label, value in rows %}
  <tr>
    <td valign="top" style="padding:10px 12px 10px 0;border-bottom:1px solid #e2e5e9;font-family:{{ sans }};font-size:14px;line-height:1.5;color:#5b6470;width:38%">{{ label }}</td>
    <td valign="top" style="padding:10px 0;border-bottom:1px solid #e2e5e9;font-family:{{ sans }};font-size:14px;line-height:1.5;color:#1d2127;font-weight:600">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
{%- endmacro %}
