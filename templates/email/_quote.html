{# A message as people typed it: escaped, with its line breaks kept. #}
{% from "email/_parts.html" import sans %}
{% macro quote(label, text, tone="#003b6b") -%}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:6px 0 16px">
  <tr><td style="border-left:3px solid {{ tone }};background-color:#f3f5f8;border-radius:0 8px 8px 0;padding:12px 16px;font-family:{{ sans }}">
    <span style="display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5b6470;margin-bottom:4px">{{ label }}</span>
    <span style="display:block;font-size:15px;line-height:1.6;color:#1d2127">{{ text|escape|replace("\n", "<br>"|safe) }}</span>
  </td></tr>
</table>
{%- endmacro %}
